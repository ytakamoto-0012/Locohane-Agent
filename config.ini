# ============================================================================
# Locohane 設定ファイル
#
# すべての接続先・保存先パスをこの1ファイルに集約する（透明性最優先）。
# 各値は環境変数で上書き可能（対応する環境変数名は src/config.py を参照）。
# ============================================================================

[llm]
# --- メインエージェント用の接続先 ---
# llama.cpp server（llama-server）の OpenAI 互換エンドポイント。複数指定した場合は main_routing_strategy に従って呼び出しごとに選ぶ（1件のみなら常にそれを使う）。1接続先 = {"base_url":..., "api_key":..., "model":...} の dict。JSON/Python風リスト形式（角カッコ＋改行複数行OK、末尾カンマ許容。
# [thinking_loop_guard].nudge_messages と同じ記法）で指定する。
#   base_url: 例 http://localhost:8080/v1（例: llama-server --host 127.0.0.1 --port 8080）
#   api_key : llama.cpp は認証不要のためダミー値でよい（空だとクライアントが弾くため何か入れる）。省略時は "dummy-not-used"。
#   model   : llama-server の --model / --alias に合わせて切り替える。
#   start/end: この接続先を使用可能にする時間帯（任意）。単位は時間(H)、分は小数で指定する（例: 9.5 = 9:30、22.25 = 22:15）。
#             start/end は必ずセットで指定する（片方だけの指定は不可）。
#             両方省略すると常時使用可能になる。start > end の場合は日をまたぐ範囲として扱う（例: start=22, end=6 なら22:00〜翌6:00）。
#             リスト全体で最低1件は start/end を両方省略した「常時使用可能」な接続先が必要（どの時間帯にも当てはまらない瞬間が生じないようにするため）。時間帯外の接続先しか無い瞬間は、常時使用可能な接続先（無ければ全接続先）から選ばれる。
#   provider: "openai_compatible"（既定、省略可）/ "llama_cpp" / "vllm"。
#             推論サーバーの種類。送信する拡張パラメータ名と thinking のフィールド名をサーバーに合わせる（src/llm/dialect.py 参照）。
#             "vllm" の場合、下記の repeat_penalty は repetition_penalty、reasoning_budget は thinking_token_budget として送り、vLLM に無い dry_* / reasoning_format / reasoning_budget_message は送らない（起動後の初回に WARNING を1回出す）。
#             "openai_compatible" は llama-server と同じパラメータを送る。
#             また round_robin / priority_failover戦略では、"llama_cpp" にすると、その接続先を選ぶ前に GET /slots で空きスロットの有無を確認し、空きが無ければスキップして次点の接続先へ、候補全てが埋まっていれば round_robin_busy_poll_interval_seconds 秒待ってから再確認する（下記参照）。選んでから最初のリクエストを送るまでの間は、同時に選択中の他の呼び出しがその空きを使わないよう予約する。llama.cpp server 固有のAPI（--slots 起動オプションが有効な場合のみ動作）のため、それ以外の OpenAI互換サーバーでは指定しないこと（その場合は確認を行わず従来通り即座に選ぶ）。
#    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B"},
#    {"base_url": "http://localhost:12431/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B", "start": 22, "end": 6, "provider": "llama_cpp"},
main_url = [
    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B", "provider": "llama_cpp"},
    ]
# main_url が複数ある場合の選び方。
#   round_robin      : 呼び出しごとに順番に回す（既定）。provider="llama_cpp"の接続先は選ぶ前に GET /slots で空きスロットの有無を確認し、空きが無ければスキップして次点へ、候補全てが埋まっていれば空きが出るまで待機する（round_robin_busy_poll_interval_seconds参照）。
#                       provider="openai_compatible"の接続先は確認せず従来通り即座に選ぶ。
#   random            : 呼び出しごとにランダムに選ぶ
#   priority_failover : 常に先頭を使い、通信エラー検知時のみ次点へ一時的に切り替える。provider="llama_cpp"の接続先は round_robin と同様に選ぶ前に GET /slots で空きスロットの有無を確認し、空きが無ければスキップして次点へ、候補全てが埋まっていれば空きが出るまで待機する。
#                       provider="openai_compatible"の接続先は確認せず従来通り即座に選ぶ。
main_routing_strategy = round_robin

# --- サブエージェント（dispatch_agent）用の接続先 ---
# main_url と同じ形式・既定値。メインエージェントとは別のllama-server インスタンス／別モデルへ振り分けたい場合にここを変更する。
# 未指定（キー無し、または値を空にする）の場合は main_url をそのまま使う。
# main_url未指定の時は、 sub_routing_strategyは無効。
# agents/*.md の frontmatter model（または dispatch_agent の model 引数）でモデル名を指定すると、ここの "model" が一致する接続先だけを候補に sub_routing_strategy で選ぶ。一致する接続先が無い（または全て時間帯外の）場合は下記 sub_default_model、それも使えなければ指定を無視する。
sub_url = [
    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B", "provider": "llama_cpp"},
    ]
sub_routing_strategy = round_robin
# サブエージェントにモデル指定（agents/*.md の frontmatter model・dispatch_agent の model 引数）が無い場合に使うモデル名。
# sub_url の "model" と一致する接続先だけを候補に sub_routing_strategy で選ぶ（大文字小文字は区別しない）。
# sub_url に軽量モデルと高性能モデルを混在させる場合、ここを指定しないと未指定の委譲が無作為にどちらかへ振られる。
# 上記のモデル指定が一致しない（または全て時間帯外の）場合もこのモデルを使う。
# 空欄なら従来どおりモデル名を見ずに選ぶ。一致する接続先が無い（または全て時間帯外の）場合は無視される（名前の誤りは起動時に app.log へ WARNING を1回出す）。
# 注意: sub_url を空にしてメインの接続先を引き継ぐ設定でも有効。メインが別モデルの接続先を使っていると、サブエージェントはそれを引き継がず、
#       main_url のうち sub_default_model のモデルの接続先から選ぶ（メインと同じ接続先を使わせたいなら空欄にする）。
sub_default_model =

# --- 生成パラメータ（main/sub共通） ---
# 生成のばらつき（0.0〜）。ツール呼び出しの安定性を優先し低めに設定する。
temperature = 1.0
# 累積確率上位のみサンプリングする閾値（0〜1）。空欄なら未指定（llama-server既定に委ねる）。
top_p = 0.95
# 上位k候補のみサンプリングする（llama.cpp / vLLM拡張、OpenAI標準APIには無い）。空欄なら未指定。
top_k = 20
# 直近生成トークンの再出現を抑制する係数（llama.cpp拡張、1.0=無効、1.1前後で軽く抑制）。
# provider="vllm" の接続先へは repetition_penalty として送る。空欄なら未指定。thinking（<think>ブロック）内で同じ文言を繰り返すループの抑制に直接効くが、ファイルパス等の反復文字列の生成精度とトレードオフの関係にあるため、ループ抑制自体は thinking_loop_guard（アプリ側の検知+リトライ）に委ねている。
repeat_penalty = 1.0
# 出現済みトークン全体への一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
frequency_penalty = 0
# 一度でも出現したトークンへの一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
presence_penalty = 0
# 1リクエストあたりの最大生成トークン数。空欄なら無制限（llama-server既定に委ねる）。
# thinkingの暴走で応答が返らなくなるケースの歯止めにもなる。
max_tokens =
# --- DRY (Don't Repeat Yourself) サンプラー（llama.cpp拡張、vLLMへは送らない） ---
# repeat_penalty より長いフレーズ単位の反復（thinking内で同じ文を繰り返す等）に強く効く。0.0 または空欄で無効。ファイルパス等の反復文字列の生成精度とのトレードオフがあるため、暴走対策は[thinking_loop_guard]（アプリ側の検知+リトライ）と[llm].max_tokens（最終的な歯止め）に委ねている。
dry_multiplier =
# 反復長に対するペナルティの指数増加率（既定 1.75 相当）。空欄なら未指定。
dry_base =
# この文字数以下の反復は許容する（既定 2 相当）。空欄なら未指定。
dry_allowed_length = 
# 反復検出に遡って見るトークン数（-1 でコンテキスト全体、既定 -1 相当）。空欄なら未指定。
dry_penalty_last_n = 
# 反復検出をリセットする区切り文字（リスト形式で複数指定、例: ["\n", ":", "\"", "*"]）。
# 空リスト[]なら llama-server 既定（改行・:・"・*）に委ねる。
dry_sequence_breakers = []
# Qwen3系モデルの thinking（reasoning、<think>ブロック）モードのON/OFF（llama.cpp / vLLM共通、extra_body の chat_template_kwargs 経由で送る）。
# 空欄なら未指定でモデル・llama-server既定に委ねる。false にすると reasoning をオフにする（応答速度は上がるが、複雑なタスクの精度は落ちる可能性がある）。
enable_thinking = true
# thinkingタグ（<think>...</think>）の扱い方（llama.cpp拡張、extra_body 経由で送る。llama-server起動時の --reasoning-format FORMAT と対応する値）。
# vLLM へは送らない（vLLM は起動時の --reasoning-parser で決まる）。
#   none            : パースせず <think> タグを含めたまま message.content に残す
#   deepseek        : 思考部分を message.reasoning_content に分離して格納する（本アプリの ChatLlamaCpp は reasoning_content / reasoning を拾い上げてUIの思考表示に使っている。
#                     src/llm/chat_model.py の ChatLlamaCpp docstring参照）
#   deepseek-legacy : <think> タグを message.content に残しつつ、message.reasoning_content にも入れる（旧DeepSeek API互換）
# 空欄なら未指定（llama-server既定の auto ＝テンプレートから自動判定に委ねる）。
reasoning_format = deepseek
# 思考（thinking）に使えるトークン数の上限（extra_body 経由で送る。
# llama-server起動時の --reasoning-budget N と対応する値）。
# -1 = 無制限、N>0 = そのトークン数を上限にする。
# llama-server へは reasoning_budget_tokens、vLLM へは thinking_token_budget（-1 は送らない）として送る。llama-server はリクエストでの 0 を無視する（vLLM は 0 で thinking なしになる）ため、どちらでも thinking を止めたい場合は reasoning_effort = none か enable_thinking = false を使う。
# 注意: この上限で思考が打ち切られると、残りの思考が本文（content）に漏れることがある（llama-server b10437 / Qwen3.8 では6回中3回、vLLM 0.30.0 / Qwen3.5-9B-AWQ では打ち切り後の思考がほぼ全て本文に出た）。本文へ漏れた thinking はそのまま回答として扱われるため、設定する場合は十分大きな値にする。
# 空欄なら未指定（llama-server既定の -1＝無制限に委ねる）。
reasoning_budget = 4096
# 上記 reasoning_budget を使い切った際に、思考終了タグの直前に挿入するメッセージ（llama.cpp拡張、extra_body 経由で送る。llama-server起動時の--reasoning-budget-message MESSAGE と対応する値）。空欄なら挿入しない（llama-server既定）。vLLM へは送らない。
reasoning_budget_message = "**Excuse me!** You have a limited reasoning budget. Prioritize the key steps and stop reasoning once you have enough evidence to answer."
# chat template へ渡す推論努力レベル（llama.cpp / vLLM共通、extra_body 経由で送る。llama-server起動時の --reasoning-effort LEVEL と対応する値）。
#   none / default / minimal / low / medium / high / xhigh / max
# none は thinking を無効化する（テンプレートが reasoning_effort を読まない場合にも効くよう、enable_thinking = true より優先して enable_thinking=false も送る）。default は「送らない」と同じ扱い。
# 受け付ける値はモデルのテンプレート次第で、対応外の値はリクエストがエラーになる（例: Qwen3.8 は low / medium / high / xhigh のみ。minimal / max は HTTP 500）。空欄なら未指定（サーバー既定に委ねる）。
reasoning_effort = medium
# 過去の assistant メッセージの thinking を会話履歴に残して送るかどうか（llama-server起動時の --reasoning-preserve / --no-reasoning-preserve に相当。extra_body の chat_template_kwargs に preserve_reasoning と preserve_thinking の両方を載せて送る）。true の場合、本アプリが保持している過去応答の thinking もリクエストへ含める（コンテキスト消費は増える）。含めるのは最後のユーザー発言より後（今のツールループ内）の thinking だけで、それより前のユーザーターンの thinking は送らない。
# フィールド名は provider に合わせる（llama_cpp: reasoning_content、
# vllm: reasoning、openai_compatible: 両方）。[context_trim].trim_ai_messages が有効なら、トリム発動時に保持範囲外の古い thinking は送らない。
# テンプレートが対応していないモデルでは効果が無い（例: Qwen3.5 は preserve_thinking に関係なく、最後のユーザー発言より前の thinking を常に捨てる。Qwen3.8 は対応）。
# 空欄なら未指定（サーバー既定に委ねる）。
reasoning_preserve = true
# トークン使用量（入力/出力/合計）を取得するかどうか。true にすると ChatOpenAI の stream_usage=True が有効化され、Chainlit UI とeval結果にトークン数が表示される。llama-server が stream_options.include_usage 拡張に未対応でエラーになる場合のみ false にする。
track_token_usage = true
# ==== request_timeout_seconds と stream_chunk_timeout_seconds の関係 ====
# この2つは実装上「入れ子」になっている。langchain_openai の stream_chunk_timeout（下のstream_chunk_timeout_seconds）は、内側で httpxのread timeout（下のrequest_timeout_seconds）を待つ処理を asyncio.wait_forでラップしているだけで、独立に監視しているわけではない。
#   外側: asyncio.wait_for(..., timeout=stream_chunk_timeout_seconds)
#     内側: httpx read（timeout=request_timeout_seconds）
# そのためサーバーがまだ1バイトも返していない区間（＝プロンプト処理(prefill)が終わって最初のチャンクが届くまでの待ち時間）は、両方の時計が同時に進む。つまり実際に待てる時間は
#   実効タイムアウト = min(request_timeout_seconds, stream_chunk_timeout_seconds)
# であり、片方だけ大きくしても、もう片方が小さければそちらが先に発火してタイムアウトする。数万トークン級の長いプロンプトを送るとprefillが長引くため、両方ともprefill所要時間より十分大きい値にしておく必要がある。
# 「大きい方を上げれば安全」ではなく「小さい方が上限になる」点に注意。
#
# 実測に基づく推奨値の算出は evals/analyze_timing.py を使うこと（evals/analyze_timing.py の算出式。数値が変わったらそちらが正）:
#   request_timeout_seconds      推奨値 = ceil(max_llm_total_seconds × 1.5)（下限60秒）
#   stream_chunk_timeout_seconds 推奨値 = ceil(max_stream_chunk_gap_seconds × 2.0)（下限30秒）
#
# LLMサーバーへの応答待ちタイムアウト秒数（read/write/pool。connectは別途固定10秒）。上記の入れ子構造でいう「内側」＝httpxレベルで、生のバイトがソケットに届く間隔を計測する最も低レベルのタイムアウト。read timeoutはチャンク間のアイドル時間の上限で、生成が続く限りチャンク到達のたびにリセットされるため、正常な長時間ストリーミングは妨げない（ただしストリーミング開始前のprefill待ち中も時計は進んでいる点は上記参照）。
# ストリームの後始末失敗等でクライアントが壊れたまま次のリクエストがハングし続ける異常事態を検知するための値。
request_timeout_seconds = 450
# ストリーミング中にチャンクが一定時間届かない場合のタイムアウト秒数(langchain_openaiのstream_chunk_timeout)。上記の入れ子構造でいう「外側」＝request_timeout_secondsより一段上のアプリケーション層で、パース済みチャンク（SSEの1イベント）が届く間隔を計測する。「チャンクとチャンクの間隔」の上限で、大きなコンテキストのプロンプト処理(prefill)に時間がかかる環境(CPU/GPU性能が低い、n-cpu-moeでCPUオフロードしている等)では、生成開始までにこの秒数を超えてタイムアウトしやすい。上記の通り request_timeout_secondsも同時に効いているため、こちらだけ上げても request_timeout_secondsの方が小さければ意味がない。ライブラリ既定値は120秒。この値を 0 に設定すると、langchain_openai 内の_astream_with_chunk_timeout で wait_for が無効化され、チャンク単位の asyncio.Task 生成（別タスク化）自体が止まる（request_timeout_secondsが read timeoutを担保するため、0でも安全性は損なわれない）。
stream_chunk_timeout_seconds = 250
# llama-server への同時リクエスト数の上限。1 以上: asyncio.Semaphore(N) でガードする（既定は 1＝完全直列化）。0 以下: ガード無効（無制限）。
# 全セッション・メイン/サブエージェント合算で1本の枠。LLMへの1回の生成（ストリーミング開始〜終了）の間だけ枠を占有する。接続先（main_url/sub_url）が複数あっても接続先ごとではなく合計で数える。
# 運用中の llama-server の --parallel 値（複数台なら合計）と揃えるのが安全。
#
# [graph].max_parallel / [subagent].max_parallel との関係:
#   あちらは「1セッション内でツール・サブエージェントを何本同時に走らせるか」、こちらは「その中で実際にLLMへ同時に生成させるのは何本までか」。2段の関所になっている。
#   例: [subagent].max_parallel=4、この値=2 の場合
#     - サブエージェントは4本とも起動する（UI上も4本「実行中」になる）
#     - LLM生成は同時に2本まで。残り2本はLLM呼び出しの直前で待たされる
#     - ツール実行（ファイル読み込み等）はLLM枠を使わないため4本とも同時に進む。そのため、あるサブエージェントがツールを実行している間に別のサブエージェントがLLM枠を使う、という入れ替わりは起きる
#     - 待っている時間はタイムアウト（request_timeout_seconds / stream_chunk_timeout_seconds）に数えない。計測はLLM枠を取ってから始まる
#   つまり max_parallel > この値 にしても、エラーやスロット超過は起きない。LLM待ちになるだけ。ツール実行が多いタスクでは多少速くなるが、LLM生成が中心のタスクではこの値以上には速くならない。
#   逆に max_parallel < この値 の場合、1セッションだけでは枠を使い切れない（余った枠は他のセッションが使う）。
max_concurrent_requests = 1

# --- round_robin / priority_failoverの/slots空き状況確認（provider="llama_cpp"の接続先のみ対象。キー名は互換性のため round_robin_ のまま） ---
# main_routing_strategy/sub_routing_strategy=round_robin/priority_failoverが、provider="llama_cpp"の接続先を選ぶ前に送る GET /slots 問い合わせ自体のタイムアウト秒数。
# 短めにし、応答が無ければ「わからない」として空きありとみなす（fail-safe。
# 確認できない場合は従来の確認なしの動作に寄せる）。
round_robin_slots_probe_timeout_seconds = 10
# round_robin/priority_failoverの候補（時間帯的に使用可能な接続先）全ての空きスロットが無かった場合に、再度 GET /slots で確認するまで待機する秒数。
round_robin_busy_poll_interval_seconds = 10

# ============================================================================
# トークン閾値の発火順序まとめ
# ============================================================================
# 以下の7項目を仮に全て同時にトークン超過させた場合、実装上どの順で判定・発火するかのまとめ（詳細はsrc/graph.py・src/subagent.py・src/context_compaction.py参照）。同じ「直近1回のLLM応答のtotal_tokens」を見て判定するため、複数が同時に条件を満たすことは実際に起こりうる。
#
#   [graph].token_guard_soft_threshold
#   [subagent].token_guard_soft_threshold
#   [subagent].token_guard_hard_threshold
#   [context_trim].trigger_total_tokens
#   [context_compaction].single_request_token_threshold
#   [context_compaction].token_threshold
#   [context_compaction].pre_note_threshold
#
# ■ メインエージェント側（graph.pyのcall_model/pre_model_hook）:
#   1回のLLM呼び出し「直前」に次の順で判定する。
#   1. [context_trim].trigger_total_tokens → 超過していれば入力のToolMessage/AIMessageを間引く（永続履歴は不変）。
#   2. [graph].token_guard_soft_threshold → 超過していれば引継ぎプロンプト（handoff_prompt_path）を注入。
#        発火した場合、同じ呼び出しでは3を判定しない
#        （「もう動くな」と「write_thread_noteを呼べ」が矛盾するため排他）。
#   3. [context_compaction].pre_note_threshold（2が発火しなかった場合のみ）→ 超過していればwrite_thread_note書き出しを促す。
#   上記1〜3とは別に、ツール実行が完了し安全点（孤立tool_callが無い状態）に
#   達するたび（app.py側、次のLLM呼び出しの前）に以下を判定する。
#   4. [context_compaction].token_threshold（累積） または single_request_token_threshold（単発） のOR判定 → 満たせばmaybe_compact で永続履歴を要約・圧縮する（1〜3のどれとも排他関係は無い）。
#   3→4は「次のagentノード呼び出しを待つ」のではなく、同じagent→tools
#   1往復の中でツール実行を挟んだ直後に判定されるため、直行に近い
#   （app.py: on_chat_model_endでlast_usage更新 → tools実行 → 全tool_call id
#   が揃った安全点でshould_compact判定、という順）。ただし3と4が見る
#   total_tokensの基準は1つずれる: 3はagentノードN回目呼び出し「前」に
#   N-1回目の応答のtotal_tokensを見るのに対し、4のsingle_request条件は
#   last_usage＝N回目の応答（3が注入された呼び出しの結果）のtotal_tokensを
#   見る。pre_note_thresholdをsingle_request_token_thresholdより十分小さく
#   設定するのは、この「次の1応答」ぶんの猶予でwrite_thread_noteを呼ぶ
#   余地を残すため（下記[context_compaction]セクション参照）。
#
# ■ サブエージェント側（subagent.pyのrun_subagent、dispatch_agent内ループ。
#   [subagent]・[context_trim.subagent]・[context_compaction.subagent]を使う）:
#   1 iterationごとに次の順で判定する。
#   1. [context_trim.subagent].trigger_total_tokens（LLM呼び出し直前）
#   2. [subagent].token_guard_hard_threshold → soft警告の発火有無に関わらず単独で判定する（急速なトークン爆発で
#        softを飛び越えて一気にhardへ到達するケースを取りこぼさないため。
#        以前は直前までのiterationでsoft警告発火済みであることが前提の
#        判定だったため、この飛び越えケースでガードが効かずサブエージェント
#        が打ち切られない事象があった）。発火すればその場でツール実行せず、
#        停止ボタン強制終了時と同じスクラッチノート退避（on_cancelled）を
#        行った上で打ち切り、以降は判定しない。
#   3. ツール実行
#   4. [context_compaction.subagent].token_threshold/ single_request_token_threshold のOR判定 → should_compact→maybe_compact
#   5. [subagent].token_guard_soft_threshold（まだ発火していなければ）→ 発火したら同じiterationでは6を判定しない（2と同じ排他方針）。
#   6. [context_compaction.subagent].pre_note_threshold（5が発火しなかった場合のみ）
# ============================================================================
[graph]
# ReAct ループの実装切替。
#   "handwritten" : 手書き StateGraph（agent/tools ノードを自前配線。挙動を追いやすい）
#   "prebuilt"    : LangGraph 標準の create_react_agent（実装は最小だが内部は隠蔽される）
implementation = prebuilt
# メインの ReAct ループ（agent→tools 遷移）の最大反復回数。LangGraph の recursion_limit にそのまま渡す。超過時は GraphRecursionError を app.py 側で捕捉し、ユーザーに打ち切りメッセージを表示する。
# 単位はノード遷移数（agent/tools 各1ステップ）で、[subagent] max_iterations（agent↔tools 往復回数）とは数え方が異なる点に注意。
recursion_limit = 100000

# --- 接続エラー時の自動リトライ（メインエージェント） ---
# LLMサーバーとの通信エラー（接続失敗・5xx・httpx系）を検知した場合、直近使用した接続先を一時的にクールダウンした上で（main_routing_strategy= priority_failoverの場合のみ次点の接続先へ切り替わる。round_robin/randomは呼び出しごとに元から切り替わるため実質そのまま次点に回る）、LLMグラフを再構築してから同じ反復をこの回数まで自動リトライする。0を指定するとリトライせず、ユーザーへ通信エラーを通知してターンを中断する（従来の挙動）。サブエージェント（dispatch_agent）側は [subagent] セクションの background_llm_timeout_max_retries を使う。
connection_error_max_retries = 3

# --- 並列数ガード ---
# メインエージェントのツール呼び出し（ImageAwareToolNode 経由）を、1セッションあたり同時に何件まで並列実行してよいか。LangGraph の ToolNode は同一 AIMessage内の複数tool_callsを asyncio.gather() で完全並列実行するため、モデルが1ターンで複数ツールを呼ぶと、呼び出し順とレスポンス処理順が食い違ったり、共有リソース（llama-server・DB等）への同時アクセスが起きうる（[subagent] max_parallel と同じ理由づけのメインエージェント版）。
# セッション（thread_id）ごとに独立した asyncio.Semaphore を持つため（src/tools.py の _TOOL_CALL_SEMAPHORES 参照）、この値は「1セッションが同時に使える枠」の上限であり、複数セッションが同時にこの枠を使うこと自体は妨げない。
# 1以上: asyncio.Semaphore(N) で同時実行数をその値までにガードする（既定は1＝完全直列化。呼び出し順序も asyncio.Semaphore のFIFOキューによりある程度保たれる）。
# 0以下: ガードを無効化し、並列呼び出しをそのまま許可する。
#   注: この値を [llm].max_concurrent_requests より大きくしても、LLMを使うツール（analyze_image 等）はLLM枠の空き待ちになるだけでエラーにはならない。LLMを使わないツールはこの値まで同時に動く（詳しくは [llm].max_concurrent_requests のコメント参照）。
# 注: この値を上げても、並列化されるのはツール呼び出しの実行だけで、main_url/main_routing_strategy による接続先の振り分けとは無関係。
#   メインエージェントのモデル接続先はグラフ構築時（会話開始・再開時）に一度だけ main_routing_strategy に従って選ばれ、そのセッション中は同じ接続先を使い続ける（build_model() は生成のたびには呼ばれない。
#   src/llm/chat_model.py の build_model() docstring参照）。つまり max_parallel を2以上にしても、複数のmain_url接続先へ分散されることはない。
max_parallel = 1

# --- メインエージェントのトークンガード ---
# メインエージェントの直近1回のLLM応答の total_tokens が閾値に達したら、次のモデル呼び出しの入力へ handoff_prompt_path の文言を差し込み、「ユーザーへの状況報告」と「新しいチャットで再開するための引継ぎプロンプト」を出力させて安全に終える（src/main_token_guard.py 参照）。サブエージェント側の[subagent].token_guard_* のメインエージェント版。LLM自身は自分のトークン使用量を認識できないため、コード側で判定する。track_token_usage=false の場合は usage_metadata が取得できず実質発火しない。
token_guard_enabled = true
# 低パラメータモデルでは1リクエストあたりのトークン数が一定を超えると処理を続けられなくなる。その実効上限（llama-server の --ctx-size で決まるコンテキスト長。例: 256000）から、ツール結果1往復ぶんの増加量の余裕を引いた値にすること。README の設計原則の目安（1リクエスト128,000以下）は普段の処理で守る値で、この閾値はそれを超えて増え続けた場合の安全装置のため、目安より大きい値でよい。
token_guard_soft_threshold = 170000
# 上記で差し込む文言（新しいチャットへの引継ぎ手順）のMarkdownファイル。
handoff_prompt_path = ./system_prompt/handoff_prompt.md

[subagent]
# dispatch_agent ツールが内部で回す ReAct ループの最大反復回数（agent→tools 遷移の回数）。
# 超過した場合は打ち切り、その時点までに集められたツール結果を要約して返す。
#
# この値は system_prompt.md から ${subagent_max_iterations} として参照され、「1回の dispatch_agent に渡すファイル件数の目安（バッチサイズ）」としても使う。
# 本来の意味（反復回数）とは別用途だが、プロンプト側に根拠の無い数値を直書きするのを避けるため、出典をこの1箇所に集約している。
# 補足: サブエージェントは複数のツール呼び出しを同一ターンで並列発行するため、実測では反復回数は2回程度で頭打ちになり、この値が反復側の制約になることはほぼ無い。実質的な上限は下の token_guard_* 側である。したがってバッチサイズを増減したい場合、この値を変えるだけでは足りず token_guard_* も併せて見ること。
max_iterations = 100

# --- 並列数ガード ---
# dispatch_agent ツールの実LLM呼び出しを、1セッションあたり同時に何件まで許可するか。モデルが1ターンで dispatch_agent を複数回呼ぶと、ToolNode の仕様上それらは並列実行される。バックエンドが単一インスタンスの llama-server の場合、--parallel で設定したスロット数を超えて並列に複数リクエストが飛ぶと、AIMessage の tool_calls に対応する ToolMessage が欠落してチェックポイントが破損し、次のモデル呼び出しで LangGraph が ValueError を送出しうるため導入したガード（src/tools.py の _DISPATCH_AGENT_SEMAPHORES）。
# セッション（thread_id）ごとに独立した asyncio.Semaphore を持つため、この値は「1セッションが同時に使える枠」の上限であり、複数セッションが同時にこの枠を使うこと自体は妨げない。
# 1以上: asyncio.Semaphore(N) で同時実行数をその値までにガードする。
#   運用中の llama-server の --parallel 値と揃えるのが安全（既定は1＝完全直列化）。
# 0以下: ガードを無効化し、dispatch_agent の並列呼び出しをそのまま許可する（複数llama-serverインスタンス等での検証用）。
#   注: dispatch_agent_batch の各グループ（=サブエージェント）も同じ枠を使う。batch はグループを一斉に起動するが、同時に動くのはこの値の本数までで、残りは枠が空くまで待つ（例: この値=2、グループ5件なら常に最大2件が動き、1件終わるごとに次の1件が始まる）。[graph].max_parallel は batch 呼び出し全体で1枠しか使わないため、グループの同時実行数には関係しない。
#   注: この枠はサブエージェントの開始から終了まで（LLM呼び出しとツール実行の繰り返し全体）占有する。この値を [llm].max_concurrent_requests より大きくした場合、サブエージェントはこの値の本数まで起動する。ただし同時にLLM生成できるのは max_concurrent_requests 本までで、残りはLLM呼び出しの直前で待つ（エラーにはならない。待ち時間はタイムアウトに数えない）。詳しくは [llm].max_concurrent_requests のコメント参照。
# 注: [graph].max_parallel と異なり、こちらは並列起動される dispatch_agent ごとに個別に build_model(role="sub") が呼ばれるため、sub_routing_strategy による振り分けが実際に働く。ただし [llm].sub_url を独自に複数設定している場合（sub_endpoints_inherit_main=false）に限る。sub_url未設定（既定・sub_endpoints_inherit_main=true）の場合は、並列起動された dispatch_agent全てがメインエージェントの直近選択接続先をそのまま継承するため分散されず、全て同じ接続先に集中する（src/llm/routing.py の_select_endpoint() inherit_from_role 参照）。
max_parallel = 1
# dispatch_agent_batch が1回の呼び出しで起動してよいグループ（=サブエージェント）数の上限。ファイル数 ÷ group_size（切り上げ）がこの値を超えると、ジョブを1件も起動せずにエラーを返す（pattern の指定ミスで大きなフォルダ全体に一致し、確認なしで数百件のジョブが起動されるのを防ぐ安全弁）。
# 同時に動く数ではない（同時実行数は上の max_parallel が決める）。0以下を指定すると無制限。
batch_max_groups = 0
# dispatch_agent_batch 実行中に、LLMのタイムアウト・通信エラーが background_llm_timeout_max_retries 回の再試行後も続いて打ち切られたグループがこの数に達したら、まだ起動していないグループは起動せず「未実行」として返す（LLMサーバーが落ちたまま、全グループが「タイムアウト×再試行回数」ずつ待って打ち切られるのを防ぐ）。実行中のグループはそのまま最後まで動かす。0以下を指定すると無効（常に全グループを起動する）。
batch_stop_after_unreachable_groups = 1

# --- トークン使用量ガード ---
# dispatch_agent 内のLLM応答1回分の usage_metadata.total_tokens を監視し、閾値超過時に「注意喚起（ソフト）→打ち切り（ハード）」の二段階制御を行う。
# LLM自身は自分のトークン使用量を認識できないため、コード側（src/subagent.py）で判定する。track_token_usage=false の場合は usage_metadata が取得できず実質発火しない。
token_guard_enabled = true
# 直近1回の応答の total_tokens がこの値以上になったら、そのiterationの tool_callsは通常通り実行した上で、次のモデル呼び出し前に「まとめて回答せよ」という注意メッセージを1回だけ注入する。[llm].max_tokens（絶対的なモデル側の上限）や[context_compaction].token_threshold（メイングラフ全体の圧縮閾値）より小さめの水準にすること。
token_guard_soft_threshold = 156000
# total_tokensがこの値以上の応答が来たら、ソフト警告発火済みかどうかに関わらずその場で単独判定し、そのtool_callsは実行せず、それ以上 model.ainvoke()を呼ばずに打ち切る（停止ボタン強制終了時と同じスクラッチノート退避を行った上で、max_iterations到達時と同じ要約フォーマットで返す）。急速なトークン爆発でソフト警告を飛び越えて一気にこの値へ到達した場合でも即座に発火する。token_guard_soft_thresholdより余裕を持たせた値にすること。[context_compaction].token_threshold（メイングラフ全体の圧縮閾値）を下回る水準にすることで、メイングラフ側の圧縮閾値に達するより先にサブエージェント側で自律的に収束させる狙い。
token_guard_hard_threshold = 170000
# ソフト閾値到達時に1回だけ注入する注意メッセージの文言。LLMに「まず write_thread_noteに未記録の事実を書き出し、その上で次の応答は簡潔にまとめよ」と伝える内容にすること（「次の応答でまとめて回答せよ」だけだと write_thread_noteに何も書かないまま調査結果を最終回答の本文へ丸ごと書き写してしまい、書き出しの目的＝委譲元の会話履歴肥大化の回避が果たされなくなる）。ツール呼び出し自体は引き続き許可すること（write_thread_noteの呼び出しを禁止するとかえって目的に反する）。
# configparserの仕様上、改行を含めたい場合は次の行を空白でインデントして継続行として書ける。
token_guard_soft_warning_text = [**システム通知: このタスクのトークン使用量が上限に近づいています。これ以上の新規調査は行わず、まだwrite_thread_noteに書いていない事実があればここで書き出してから、次の応答は結論の要約とtopic名の参照に留めて簡潔に回答してください**]

# --- 空応答ガード ---
# dispatch_agent内のLLM応答が tool_calls も本文も空（LLMサーバー側の異常応答）だった場合、これを正常終了とみなして空文字列を返してしまうと、それまでの調査結果が丸ごと握りつぶされて委譲元に何も伝わらない。
# この回数まで再試行し、それでも空の応答が続く場合のみ、それまでに集めたツール実行結果を要約して打ち切る。
empty_response_max_retries = 2

# --- dispatch_agent のバックグラウンドジョブ機構用設定 ---
# dispatch_agent のジョブが終了後、check_dispatch_agent_job で一度も取得されないまま registry に残ってよい秒数。超過分は次回の dispatch_agent 呼び出し時に破棄される（[scripts].background_job_retention_seconds と同じ方式）。
background_job_retention_seconds = 120
# check_dispatch_agent_job が「実行中」ステータスを返した直後、同じジョブへの次の check_dispatch_agent_job 呼び出しを許可するまでの最短間隔秒数。
# サブエージェントの1反復はLLM呼び出しを伴い[scripts]のスクリプト実行より単位時間あたりの状態変化が乏しいため、既定値は[scripts]側と同じにしておく。
# 0以下を指定すると強制を無効化する。
background_min_poll_interval_seconds = 60
# 上記の最短間隔未満で check_dispatch_agent_job が呼ばれた際に、拒否の代わりに LLMへ返すメッセージ。空欄なら組み込みの既定文言を使う。プレースホルダーは[scripts].background_min_poll_message と同じ（{wait_remaining}/{job_id}/{min_interval}）。
background_min_poll_message =
# dispatch_agent のツール呼び出しが、ジョブ完了をこの秒数まで LLMを介さずコード側で待つ（Chainlit UI上はターンがブロックされたまま「実行中」表示が続く）。この秒数を超えてもまだ実行中の場合のみ、job_id を返してLLMへ制御を戻す（フォールバック。以降は check_dispatch_agent_job で確認する）。ジョブ自体はこの上限に達してもキャンセルされず裏側で動き続ける。
# 0以下を指定すると無期限待ちになり、この安全上限フォールバック自体が発生しなくなる（job_id が返ることはなく、check_dispatch_agent_job/ stop_dispatch_agent_job も実質使われなくなる）。取りやめたい場合は Chainlitの停止ボタンを使う（内部のジョブも確実に終了させられる）。
background_inline_wait_max_seconds = 0
# 上記の待機中、人間向けに経過秒数・反復回数・進捗メモ末尾をチャットへ直接送る間隔（秒）。cl.Message送信のみでLLM呼び出しを伴わないためトークンは消費しない。
# 最初の表示はこの秒数が経ってから出す。以後は、今している動作（【思考中】【ツール: スクリプト実行】【LLMの空き待ち】等）が変わったら、この間隔を待たずに書き換える（ただし前回から最短1秒は空ける）。
background_progress_push_interval_seconds = 20
# dispatch_agent 実行中のLLM呼び出しが [llm].request_timeout_seconds/ stream_chunk_timeout_seconds に達した場合、または通信エラー（接続失敗・5xx・httpx系）を検知した場合、直近使用した接続先を一時的にクールダウンした上で（sub_routing_strategy=priority_failoverの場合のみ次点の接続先へ切り替わる）モデルを再構築してから同じ反復をこの回数までリトライする（ThinkingLoopDetectedの再構築リトライと同じ方式）。ジョブ自体はバックグラウンドタスクとして裏側で動き続けるため、1回のタイムアウトで数百件分の進捗を丸ごと諦めるのではなくリトライが妥当。メインエージェント側は [graph].connection_error_max_retries を使う。
background_llm_timeout_max_retries = 3

# dispatch_agent サブエージェントの agent_type ごとに run_script で呼べるスキル/スクリプトを制限するホワイトリスト（未登録の agent_type は制限なし）。
# ここで登録した内容は agents/*.md の {{run_script_allowlist}} プレースホルダーへ、agent_type ごとに絞り込んだ形で自動的に差し込まれる（{{skills}}と同じ仕組み）。登録がある agent_type は {{skills}} のスキル一覧もここで登録したスキルだけに絞られる（絞り込みたくない場合は agents/*.md に {{skills}} の代わりに {{all_skills}} と書くと全スキル一覧が載る）。
# [[agent_type, 対象], ...] のPython/JSON風リスト形式で指定する（末尾カンマ可）。
# 空欄なら下記の既定19件を使う。対象は次の2種類のいずれか:
#   - "スキル名"                       : そのスキル配下の全スクリプトを許可
#   - ["スキル名","スクリプトファイル名"] : そのスクリプトのみ許可
# pdf-tools のように同一スキル配下に読み込み専用スクリプト（read_pdf.py/ render_pdf_pages.py）と書き込みスクリプト（create_pdf.py）が混在するスキルは、スキル名単位ではなく後者の形式で個別に許可すること。
agent_type_run_script_allowlist = [
    ["explore","docx-render"],
    ["explore","docx-read"],
    ["explore","excel-render"],
    ["explore","excel-read"],
    ["explore","excel-vba-read"],
    ["explore","pptx-render"],
    ["explore","pptx-read"],
    ["explore","pptx-inspect"],
    ["explore",["pdf-tools","render_pdf_pages.py"]],
    ["explore",["pdf-tools","read_pdf.py"]],
    ["verifier","excel-render"],
    ["verifier","excel-read"],
    ["verifier","docx-render"],
    ["verifier","docx-read"],
    ["verifier","pptx-render"],
    ["verifier","pptx-read"],
    ["verifier","pptx-inspect"],
    ["verifier",["pdf-tools","render_pdf_pages.py"]],
    ["verifier",["pdf-tools","read_pdf.py"]],
    ]

[context_trim]
# メインエージェント（src/graph.py）向けの設定。サブエージェント（dispatch_agent、src/subagent.py の run_subagent）は、下記の[context_trim.subagent] セクションに項目があればその値を使い、未記載の項目はこのセクションの値を継承する（既定では全項目未記載＝完全継承のため、[context_trim.subagent] を編集しなければ従来通りメイン/サブで同じ値が一律に適用される）。
# 長いReActループ（ファイル読み込み等のツール呼び出しを繰り返すタスク）で、サイズ上限のないツール実行結果（例: OCR結果のMarkdown全文）が ToolMessage としてそのまま会話履歴に蓄積し続け、llama.cppへのプロンプトプリフィルが極端に遅くなる問題への対策。直近の ToolMessage 以外は content を切り詰めて LLMへの入力だけを絞り込む（会話履歴自体は書き換えない。src/context_trim.py 参照）。
# トリムを実行するとプロンプトキャッシュが一時的に効かなくなるので非推奨。
enabled = false
# トリムを発動させる閾値（Claude API の context editing、clear_tool_uses_20250919 の trigger.value 相当）。LLM呼び出しの total_tokens がこの値未満のうちはトリムを発動しない（会話が短いうちは切り詰めない）。一度でも閾値に達したら、以後その会話ではトリムを継続する（トリムで入力が閾値未満に下がるたびに解除→再トリムを繰り返すと、llama-server のプレフィックスキャッシュが毎回外れて全量プリフィルし直しになるため）。コンテキスト圧縮（[context_compaction]）が走るとトリムは解除される。0以下を指定すると常に発動する（この閾値機能が無かった旧来の挙動と同じ）。[llm].track_token_usage=false 等で total_tokens を取得できない場合は、閾値未到達とみなし発動しない点に注意。
trigger_total_tokens = 100000
# 全文保持する直近の反復数（src/context_trim.py の find_iteration_cut_index）。
# ここでいう「1反復」はReActループ1周＝LLM呼び出し1回（AIMessage 1件と、それに対応するToolMessage群）で、メインのagent→tools遷移1回、サブエージェントの1 iterationがそのまま単位になる。これより古い ToolMessage のみ切り詰め対象。
# ユーザーの発話回数では数えない: analyze_imageの画像フォローアップや各種nudge（ループガード・token_guardのソフト警告・幻覚リトライ）が HumanMessageとして履歴に積まれるため、発話回数とはずれる。注入が増えるほど保持範囲が意図せず広がり、トリムが効かなくなる。
# 単純な件数指定にもしない: 1回のAIMessageが並列発行した複数tool_callsに対応するToolMessage群のうち一部だけが保持され残りが切り詰められる、という分断を避けるため（同じ反復は丸ごと同じ側に入る）。
keep_recent_tool_iterations = 2
# 切り詰め対象 ToolMessage / AIMessage の content を、先頭何文字まで残すか（超過分はマーカー文言に置換）。
truncated_max_chars = 1000
# Read/Glob/Grep/json_query/analyze_image（[file_tools_duplicate_guard]の対象ツール。同一引数での再呼び出しに上限回数がある）の ToolMessage にだけ適用する切り詰め文字数（truncated_max_chars の代わりに使う）。これらのツールは上限到達時「会話履歴にある前回の実行結果を参照してください」と案内するが、前回結果が truncated_max_chars（プリフィル短縮のため小さめ）で切り詰められていると、実際にはモデルへ渡っていない分を参照させることになり案内が機能しない。そのため別枠でより大きい値を持たせる。
duplicate_guard_tool_max_chars = 2000
# ToolMessage だけでなく AIMessage（モデル自身の思考本文と tool_calls の引数）も切り詰めるか。execute_python_code の code 引数へファイル本文を書き写すような使い方をすると、ToolMessage 側だけを絞っても1リクエストあたりの入力が膨らみ続けてコンテキスト上限に張り付くため、既定で有効にしている。tool_calls の id/name と件数は変更しないため、ToolMessage との対応関係は壊れない。
trim_ai_messages = true
# 全文保持する直近の反復数（keep_recent_tool_iterationsと同じ判定方式。
# tool側とは独立した値を指定できる）。これより古い AIMessage のみ切り詰め対象。
keep_recent_ai_iterations = 2

[context_trim.subagent]
# サブエージェント（dispatch_agent、src/subagent.py の run_subagent）専用の上書き設定。ここに書いた項目だけが [context_trim] の同名項目を上書きし、書かなかった項目は [context_trim] の値をそのまま継承する。既定では全項目コメントアウトのため、[context_trim] と完全に同じ値が使われる。
# 例（サブエージェントだけトリムを無効化する場合）:
# enabled = false
# 例（サブエージェントだけ閾値やトリム量を変える場合）:
# trigger_total_tokens = 85000
# keep_recent_tool_iterations = 5
# truncated_max_chars = 1000
# duplicate_guard_tool_max_chars = 2000
# trim_ai_messages = true
# keep_recent_ai_iterations = 3

[context_compaction]
# ClaudeCodeのcompact相当。次の2条件のいずれかを満たしたら、古い会話履歴を LLM自身に要約させ、永続履歴（checkpointer上のメッセージ）自体を圧縮する（src/context_compaction.py 参照）:
#   1. メインエージェントの累積トークン数（token_usage_cumulative_main、圧縮が発火するたびに0へリセットされる）が token_threshold を超えた。
#   2. 直近1回のLLM呼び出しの total_tokens が single_request_token_threshold を超えた。
# 累積条件だけだと、[context_trim]による送信ペイロード削減の影響で直近リクエスト単体のトークン数は閾値未満に収まり続け、圧縮が発火しないまま永続履歴だけが肥大化し、いざ発火した際の要約LLM呼び出し自体がコンテキスト長超過を起こしうる。逆に単発条件だけだと、1ターンで巨大なツール結果やファイル内容を積まない限り会話が長引いても発火しない。そのため両方を見る。
# [context_trim]は「今回の入力だけを縮める・永続履歴は書き換えない」方針だが、こちらは永続履歴自体を縮めるため、会話が長引くほど効くプリフィル遅延・トークン量への恒久対策になる。
# [context_trim]と同様、サブエージェント（dispatch_agent）は下記の[context_compaction.subagent] セクションに項目があればその値を使い、未記載の項目はこのセクションの値を継承する（既定では完全継承）。
# ただし「累積トークン数」の起点はメインとサブで別物（メイン=スレッド全体の累積、サブ=個々のdispatch_agent呼び出し1回の中だけの累積。発火のたびに0へリセットされるのは共通）。
enabled = true
# メインエージェントの累積 total_tokens がこの値を超えたら圧縮する（圧縮発火のたびに0へリセットされるため、「圧縮1サイクルあたりの累積上限」を意味する。1リクエストあたりの上限ではない点に注意）。
token_threshold = 99999999999
# 直近1回のLLM呼び出しの total_tokens がこの値を超えたら圧縮する。
# 低パラメータモデルでは1リクエストあたりcontext window未満に収める必要があるため、ツール結果1往復分の余裕を見てそれより低い値にすること。
single_request_token_threshold = 144000
# 圧縮時に丸ごと保持する直近の反復数（[context_trim]の keep_recent_tool_iterationsと同じ単位＝ReActループ1周＝LLM呼び出し1回）。
# 構造ベース（発行済み tool_call id と返却済み ToolMessage id の一致）で安全な切断点を探し、その位置で古い側を要約対象として切り離す。
# なお圧縮は永続履歴を要約で置き換える恒久的な操作のため、この反復数とは別に「末尾のHumanMessage以降は必ず原文のまま残す」上限も内部で被せる（src/context_compaction.py の _find_compaction_cut_index）。ただしその上限をそのまま適用すると圧縮対象が空になる場合（1ターン内でLLM呼び出しを何十回も繰り返す長時間タスク）は、圧縮の機会自体が失われるため適用しない。
keep_recent_iterations = 1
# 会話全体のメッセージ数がこの件数未満なら、閾値を超えていても圧縮しない（短い会話で無駄に要約を走らせない安全弁）。
min_messages_to_compact = 10
# 要約を指示するプロンプト本文（Markdown）のパス。
compaction_prompt_path = ./system_prompt/compaction_prompt.md
# 要約対象の古い ToolMessage を要約LLMへ渡す前に切り詰める文字数（要約プロンプト自体のプリフィルが遅くならないようにするため）。
# [context_trim].truncated_max_chars とは別枠。要約は永続履歴を置き換える恒久的な操作のため、[context_trim]と同じ小さめの値を使うと要約対象のツール結果がまとめて情報欠落し、要約が内容の薄いものになりうる（例: 大量ファイル処理タスクでファイル名の列挙しか残らない）。
summary_source_max_chars = 3000
# 要約対象に入った read_skill 結果（スキル本文）は要約させず、要約の後ろへ原文のまま再添付する（要約LLMに手順を薄められないようにするため。src/context_compaction.py の _render_reattached_skills）。新しく読んだスキルから順に詰め、1スキルあたり/合計の文字数上限を超える分は切り詰め、合計に収まらない古いスキルは名前だけ列挙して read_skill での再読込を促す。サブエージェントもこの値を共有する（[context_compaction.subagent] での上書きは不可）。
skill_reattach_max_chars_per_skill = 12000
skill_reattach_total_max_chars = 36000
# 圧縮（要約）が発火する前に、write_thread_noteへまだ書いていない重要な事実（値・件数・該当箇所等）があれば書き出すよう促す注意メッセージを注入する閾値（直近1回のLLM呼び出しのtotal_tokens基準）。要約はLLM自身に行わせるため、要約対象から外れる古い会話中の具体的な事実が薄まって失われうる。write_thread_noteはファイルへの追記であり要約の影響を受けないため、失われる前に退避させる狙い（src/context_compaction.py の maybe_append_precompact_note_nudge）。single_request_token_threshold より十分小さい値にすること（注入後、実際に圧縮が発火するまでの「次の1応答」で write_thread_noteを呼ぶ余地を残すため）。0以下を指定するとこの機能を無効化する。[graph].token_guard_soft_threshold（会話全体を打ち切って新しいチャットへの引継ぎを促す完全な打ち切り）とは別物で、こちらは会話を止めずに注意喚起するだけの軽いフック（両方が同時に発動する場合は引継ぎ側を優先し、こちらは差し込まない。「ツールを呼ぶな」と「write_thread_noteを呼べ」が矛盾するため）。
# 注意: この閾値を超えている間、毎ターン無条件でこのメッセージを注入すると、メインエージェントが同じ内容のnoteを書き直し続ける実質的な無限ループになる。
# そのため実装では「直近keep_recent_iterations反復以内にwrite_thread_noteが既に呼ばれていれば再注入しない」判定（_write_thread_note_called_recently）を挟んでおり、keep_recent_iterationsを使い回している（新しい設定値を増やさないため）。keep_recent_iterationsを変更するとこの再ナッジ抑制の範囲も連動して変わる点に注意。
pre_note_threshold = 128000
# 上記閾値到達時に注入する注意メッセージの文言。write_thread_noteへの書き出しを促す内容にすること。configparserの仕様上、改行を含めたい場合は次の行を空白でインデントして継続行として書ける。
pre_note_warning_text = [**システム通知: まもなくコンテキスト圧縮（古い会話履歴の要約）が行われます。要約後は書き出していない事実が失われるおそれがあるため、write_thread_noteにまだ記録していない重要な事実（値・件数・該当箇所等）があれば、次の応答でツールを呼ぶ前に書き出してください**]
# 圧縮発火条件に「直近keep_recent_iterations反復以内にwrite_thread_noteが呼ばれていること」を追加で課す。token_threshold/single_request_token_thresholdを満たしていても未呼び出しの間は、app.py の _run_context_compaction が force_write_thread_note（src/context_compaction.py）でその場での書き出しを強制する（write_thread_note以外のツールを使えなくした上でモデルを1回呼び出す。tool_choice="required"をツール1件に絞って渡すことで実現。
# pre_note_thresholdによる注意喚起だけでは、LLMが無視し続けた場合に記録が一切残らないまま圧縮されうるため、待つのではなく強制する）。
# この値は force_write_thread_note 自体が失敗（LLM呼び出しエラー・tool_calls空・状態更新失敗等）し続けた場合の安全弁で、失敗回数がこの値に達すると、記録が無くても圧縮を強制する（無視され続けてコンテキスト上限に張り付くのを防ぐ）。0を指定すると無期限に待つ（write_thread_noteの強制実行に成功するまで圧縮しない。token_guardのsoft/hard閾値による打ち切りに委ねることになる点に注意）。
require_note_max_skips = 2

[context_compaction.subagent]
# サブエージェント（dispatch_agent）専用の上書き設定。ここに書いた項目だけが[context_compaction] の同名項目を上書きし、書かなかった項目は[context_compaction] の値をそのまま継承する。既定では全項目コメントアウトのため、[context_compaction] と完全に同じ値が使われる。
# 例（サブエージェントだけ圧縮を無効化する場合）:
# enabled = false
# 例（サブエージェントだけ閾値を変える場合）:
# token_threshold = 99999999999
# single_request_token_threshold = 90000
# keep_recent_iterations = 3
# min_messages_to_compact = 10
# compaction_prompt_path = ./system_prompt/compaction_prompt.md
# summary_source_max_chars = 3000
# pre_note_threshold = 81920
# pre_note_warning_text = [**システム通知...**]
# require_note_max_skips = 2

[scripts]
# run_script ツール・execute_python_code ツール共通の実行設定。
# 実行タイムアウト秒数（run_script / execute_python_code 共通）。
timeout = 300
# .py スクリプトを起動する Python 実行ファイル（run_script / execute_python_code 共通）。
# 空欄なら Locohane 本体を起動している Python（python_env.bat の PYTHON_DIR）を使う。
python =
# execute_python_code ツール（LLMが生成したPythonコードをその場で実行する）の有効/無効。
# false にすると、ツール自体は呼び出されてもエラーを返すだけになり、コードは実行されない。
code_execution_enabled = true
# ここから run_script_background（バックグラウンド実行版）専用の設定。
# バックグラウンドジョブを強制終了するまでの上限秒数（timeout とは別軸。
# 同期版 run_script より長時間の実行を想定した上限）。
background_max_runtime_seconds = 3600
# ジョブが完了・失敗・タイムアウト等で終了した後、check_script_job で一度も取得されないまま残ってよい秒数。超過分は次回の run_script_background 呼び出し時に破棄される。
background_job_retention_seconds = 120
# check_script_job が「実行中」ステータスを返した直後、同じジョブへの次の check_script_job 呼び出しを許可するまでの最短間隔秒数。SKILL.md やツールの docstringで「数秒おきに呼び直さない」よう指示しても、ローカルLLMが指示に従わず数秒おきに再確認し続ける事例があったため、サーバー側で強制する（間隔未満での呼び出しは下記 background_min_poll_message を返すのみで、標準出力・標準エラーは含めない）。0以下を指定すると強制を無効化する。
background_min_poll_interval_seconds = 60
# 上記の最短間隔未満で check_script_job が呼ばれた際に、拒否の代わりにLLMへ返すメッセージ。空欄なら組み込みの既定文言（「まだ確認間隔が短すぎます。
# あと約N秒待ってから…」）を使う。Python の str.format() 記法で下記3つのプレースホルダーを埋め込める（これ以外の名前を書くとサーバー起動時にエラーになる）。
#   {wait_remaining} : あと何秒待てば呼び直せるか（整数、切り上げ）
#   {job_id}         : 対象ジョブID（repr形式。{job_id!r} と書くと引用符付きで埋め込まれ、check_script_job(job_id=...) にそのまま貼り付けられる形になる）
#   {min_interval}   : background_min_poll_interval_seconds の値そのもの
# 例:
# background_min_poll_message = ポーリング間隔が短すぎます。約{wait_remaining}秒後に check_script_job(job_id={job_id!r}) を再実行してください（最短間隔: {min_interval}秒）。
background_min_poll_message =
# run_script_background/execute_python_code_background のツール呼び出しが、ジョブ完了をこの秒数までLLMを介さずコード側で待つ（Chainlit UI上はターンがブロックされたまま「実行中」表示が続く）。この秒数を超えてもまだ実行中の場合のみ、job_id を返してLLMへ制御を戻す（フォールバック。以降は check_script_job で確認する）。ジョブ自体はこの上限に達してもキャンセルされず裏側で動き続ける。
# 0以下を指定すると無期限待ちになり、この安全上限フォールバック自体が発生しなくなる（job_id が返ることはなく、check_script_job/stop_script_job も実質使われなくなる）。取りやめたい場合は Chainlitの停止ボタンを使う（内部のジョブも確実に終了させられる）。
background_inline_wait_max_seconds = 0
# 上記の待機中、人間向けに経過秒数・標準出力/標準エラー末尾をチャットへ直接送る間隔（秒）。cl.Message送信のみでLLM呼び出しを伴わないためトークンは消費しない。
background_progress_push_interval_seconds = 20
# 上記の進捗表示、および check_script_job/stop_script_job/read_thread_note が「実行中」「強制終了時点」等で末尾のみ表示する際の、標準出力/標準エラー/進捗メモの最大文字数。全量を表示するとコンテキストを圧迫するため切り詰める。
# dispatch_agent の進捗表示（[subagent]配下）も同じ値を共有する。
background_job_output_tail_chars = 256

[file_tools_duplicate_guard]
# Read/Glob/Grep/json_query/read_skill/read_skill_file/get_tool_source ツールを同一引数で繰り返し呼び出すのを防ぐガード機能の設定。これらは読み取り専用のため、同一引数での再実行は結果が変わらないと保証できることを利用している（小型ローカルモデルが進捗の無いまま同じ呼び出しを会話全体を通じて散発的に繰り返す事例への対策。read_skill/read_skill_file は加えて、コンテキスト圧縮で過去の読み込み結果がメッセージ履歴から消えた後に同じ大きいSKILL.md等を何度も読み直すthrashingの対策も兼ねる。
# src/tools.py の _check_file_tools_duplicate / _record_and_check_duplicate 参照）。
enabled = false
# 同一シグネチャ（ツール名+引数）の呼び出しを何回まで許可するか（この回数に達した以降の呼び出しをエラーで拒否する）。既定は1回（＝初回のみ許可し、2回目以降は拒否）。
max_calls = 5
# サブエージェント（dispatch_agent）内での呼び出し履歴を、メインエージェントの判定へ持ち越すかどうか。
#   true　　　　  : メインエージェントとサブエージェントで呼び出し集合を共有する。
#                   例えばサブエージェントが読んだファイルを、その後メインエージェントが同じ引数で読もうとしても重複として拒否される。
#   false         : メインエージェントとサブエージェントの呼び出し履歴を別々に管理する。サブエージェント内の呼び出しはメインエージェント側の判定に影響しなくなる（逆にメインエージェントの呼び出し履歴もサブエージェント側の判定には影響しない）。
carry_over_to_main = false

[main_agent_tool_guard]
# メインエージェント自身が「登録済みのツール」を直接呼び出せる回数を制限する汎用ガード。ビルトインツール名（例: Glob・analyze_image）・run_script配下のスキルスクリプト（例: pdf-tools/render_pdf_pages.py）のどちらも同じリストへ、エントリごとに上限回数（max_calls）を指定して登録できる（旧・Glob専用ガード main_agent_glob_guard は本ガードへ統合済み。既定の allow_entries に ["Glob", 1] を含めることで従来と同じ挙動を引き継ぐ）。
# [plan].plan_approval_exempt_scripts は計画承認（Plan Mode）を免除するだけで、免除されたスクリプトをメインエージェントが直接・繰り返し呼ぶこと自体は妨げない。
# このため、例えば render_pdf_pages.py でスキャンPDFを画像化し、その結果へメインエージェント自身が analyze_image を委譲せず何十枚も連打してトークン上限に達するといった事態を防ぐ狙いがある。サブエージェント（dispatch_agent）内部での呼び出しは対象外（調査そのものが役目のため）。src/tools.py の_guard_main_agent_tool_limit 参照。
#   false             : ガード無効（メインエージェントは全ツールを制限なく呼べる）。
#   tools_skills_only : MCPサーバー（[mcp]セクション）経由の動的ツール（mcp__<サーバー名>__<ツール名>形式）のみ常に許可し、ビルトインツール・run_scriptスキルは下記allow_entriesで従来通り制限する。MCPサーバーのツール名は実行時にしか分からずallow_entriesへ事前登録できないため、MCPサーバーを使う場合はこのモードが便利。
#   all               : ビルトインツール・run_scriptスキル・MCP動的ツールの全てをallow_entriesで制限する（従来のenabled=true相当）。
mode = tools_skills_only
# 可視化モード。mode（呼び出し制限そのもののON/OFF/範囲）とは独立した設定で、modeの値に関わらずこの値だけで一覧の見せ方が決まる。対象はスキル一覧とビルトインツールの呼べない名前案内で、MCP動的ツールはこの説明の対象として想定されていない（ただし呼べない名前案内は mode=all のとき get_all_tools()＝ビルトイン+MCP全体が対象になるため、MCP動的ツール名も混ざりうる。
# mode=tools_skills_only ならMCPは常に許可されるため混ざらない）。
#   all           : 全スキル名・ツール名・descriptionを一覧に表示するが、直接実行できないものは description の末尾に「（直接実行不可。実行は dispatch_agent へ委譲。）」を追記する。ビルトインツールは呼べない名前一覧のみテキストで提示する（bindはしない）。
#                   mode=falseの場合は呼び出せないものが無いため注記は付かない。
#   strict（既定）: 呼び出せないスキル・ツールは一覧からも完全に除外する（従来の挙動。「見えるのに呼べず拒否される」無駄な往復を防ぐ）。
#                   mode=falseの場合は呼び出せないものが無いため全件表示となる。
#   hint          : 一覧には全スキル名を出すが、直接実行できないものは description を「直接実行不可。このスキルの詳細確認・実行は dispatch_agent へ委譲」に差し替える。ビルトインツールは呼べない名前一覧のみテキストで提示する（bindはしない）。
#                   mode=falseの場合は呼び出せないものが無いため全件表示となる（descriptionの差し替えも発生しない）。
visibility_mode = hint
# 許可リスト（ホワイトリスト）。ここに登録されていないツール名・run_script スキルスクリプトは、mode=all（またはmode=tools_skills_only時のMCP以外）の間メインエージェントから一切呼び出せない（未登録＝呼び出し不可。
# dispatch_agent配下のサブエージェントは対象外）。
# 各要素は [対象, max_calls] の2要素（末尾カンマ可のPython/JSON風リスト形式）。
# キー名 allow_entries が示す通り、本ガードは「登録した対象だけを許可する」ホワイトリストであり、ブロック対象の指定ではない。
# max_calls はエントリごとに個別指定する（メインエージェントが1ターンあたりそのエントリを直接呼び出せる回数の上限）:
#   - 0     : 登録はするが完全ブロック（1回も呼び出せない）
#   - -1    : 登録した上で回数無制限に許可する
#   - 1以上 : その回数まで許可し、超過分を拒否する
# 他の呼び出し回数ガード（file_tools_duplicate_guard等）は0以下を「無制限」として扱うが、本ガードは0と-1の意味が逆になるので注意。
# 対象（1つ目の要素）は次の2種類のいずれか:
#   - 文字列1件（例: "Glob", "analyze_image"）  : ビルトインツール名そのもの
#   - ["スキル名","スクリプトファイル名"]        : run_script/run_script_background 経由で呼ばれるスキルスクリプト（scripts/を持つスキル用）。
#                                              scripts/を持たないSKILL.mdのみのスキル（例: "excel-knowledge"）は run_scriptの対象自体が無いため、スクリプトファイル名を空文字列にした ["スキル名", ""] のダミーエントリで登録する。この形は run_scriptの実行許可には一切影響せず（空文字列が実際の script_filenameと一致することは無いため）、{{skills}} 一覧へ載せるかどうかの指定にのみ効く（src/skills.py の is_skill_directly_runnable 参照）。
# 空欄なら何も登録されず、mode=all（またはtools_skills_only時のMCP以外）の間メインエージェントはいかなるツールも呼び出せず、scripts/を持たないスキルも{{skills}} 一覧に1件も現れなくなる。
#
# MCPサーバー（[mcp]セクション）経由で動的に追加されるツールは名前が実行時にしか分からないため、ここに事前登録できない。mode=all のままMCPサーバーを接続する場合、そのツール名を明示的にこのallow_entriesへ追加登録しない限り、メインエージェントからは一切呼び出せない点に注意（サブエージェント経由なら本ガードの対象外なので使える）。事前登録せずMCP動的ツールを常に許可したい場合は mode=tools_skills_only を使う。
#
# --- 重量系ツール（トークン消費が大きく、連打によるトークン上限到達リスクが
#     あるもの）: Glob以外はあえて登録しない ---
# Read/Grep/json_query/execute_python_code系/skills/配下の全スキルの全エントリースクリプトは、許可リスト方式のもとでは「allow_entries に書かない」だけで自動的に完全ブロックされる（未登録＝呼び出し不可のため、わざわざ max_calls=0で明示登録する必要はない）。dispatch_agentへの委譲を必須にする狙いは変わらない。
# analyze_imageは例外（下記「基本運用に必須のツール」参照。show_image統合により直接呼び出しを許可している）。
#
# --- メインエージェントの基本運用に必須のツール: max_calls=-1（無制限）で登録 ---
#   - dispatch_agent / dispatch_agent_batch / check_dispatch_agent_job / stop_dispatch_agent_job（委譲の仕組みそのもの。1ターンで複数フォルダへ委譲するのが正常な使い方）
#   - create_plan / approve_plan / update_task_progress / get_plan_status / lock_plan_mode（計画は複数ステップを持つのが通常で、update_task_progressはステップ数分呼ぶ）
#   - AskUserQuestion / ask_user_choice（複数項目の確認で複数回呼ぶことがある）
#   - create_memory / update_memory / delete_memory / read_memory / search_memory / list_memories（1ターンで複数の記憶を扱うことがあり、内容も小さくトークンリスクが低い）
#   - read_skill / read_skill_file / get_tool_source（1ターンで複数スキルを読むのが正常）
#   - check_script_job / stop_script_job（ジョブ管理）
#   - check_work_dir_status / search_path_memory / provide_download / help / write_thread_note / list_thread_notes / read_thread_note（トークンリスクが低い軽量ツール）
#   - list_document_collections / search_documents（ベクターDBの検索。結果全体を [vector_db].max_result_chars で切り詰めるためトークンリスクが低い）
#   - analyze_image（show_image統合によりメインエージェントも直接呼べる。
#     ただし1〜2枚程度が目安。大量ページを連打するとトークン上限に達しうるため、system_prompt.md「画像の扱い」節で大量枚数はworker/exploreへの委譲を促している）
# run_script / run_script_background は裸のツール名としては登録しない（登録するとどのスキルスクリプトを実行したかに関わらず一括制限されてしまい、下記の [スキル名,スクリプトファイル名] 単位の粒度が意味を失うため）。
# このため新規スキルスクリプトを追加した場合、下のallow_entriesへ個別に追記しない限りメインエージェントからは実行できない（サブエージェント経由なら実行可能）。
allow_entries = [
    ["dispatch_agent", -1],
    ["dispatch_agent_batch", -1],
    ["check_dispatch_agent_job", -1],
    ["stop_dispatch_agent_job", -1],
    ["create_plan", -1],
    ["approve_plan", -1],
    ["update_task_progress", -1],
    ["get_plan_status", -1],
    ["lock_plan_mode", -1],
    ["AskUserQuestion", -1],
    ["ask_user_choice", -1],
    ["create_memory", -1],
    ["update_memory", -1],
    ["delete_memory", -1],
    ["read_memory", -1],
    ["search_memory", -1],
    ["list_memories", -1],
    ["read_skill", -1],
    ["read_skill_file", -1],
    ["get_tool_source", -1],
    ["check_script_job", -1],
    ["stop_script_job", -1],
    ["check_work_dir_status", -1],
    # system_prompt の「対象ルート直下だけを見る1回限りの Glob」に合わせて1回だけ許可する。
    # 外すとモデルが Glob を呼ぼうとして AskUserQuestion 等の別ツールにすり替わる。
    ["Glob", 1],
    ["search_path_memory", -1],
    ["analyze_image", 1],
    ["provide_download", -1],
    ["help", -1],
    ["write_thread_note", -1],
    ["list_thread_notes", -1],
    ["read_thread_note", -1],
    ["list_document_collections", -1],
    ["search_documents", -1],
    # scripts/を持たないSKILL.mdのみのスキル（read_skill/read_skill_fileだけで
    # 完結する）を {{skills}} 一覧に載せる指定。スクリプトファイル名を空文字列に
    # した [スキル名, ""] のダミーエントリで登録する（run_scriptの実行対象は
    # 無いため実行許可には影響しない）。max_calls の数値自体に意味は無いが、
    # 0にすると一覧から除外される。
    [["excel-knowledge", ""], -1],
    [["excel-vba-knowledge", ""], -1],
    ]

[thinking_loop_guard]
# LLM応答（thinking/本文）のストリーミング中に反復ループ（同一の文・コードブロックがほぼそのまま繰り返される暴走）を検知したら、生成を打ち切って注意メッセージを注入し再試行する機能の設定。[llm].dry_multiplier（サーバー側のDRYサンプラー）で大幅に抑制されるが、完全には無くならない残存リスクへのアプリ側（クライアント側）の安全網。
enabled = true
# ループ検知の監視対象。
#   all          : 思考（thinking）と本文の両方を監視する（従来どおり）。
#   content_only : 本文だけを監視する。思考のループは [llm].reasoning_budget（思考予算）での打ち切りに任せる。思考予算は誤検知が無く、打ち切られたモデルがそのまま回答（ツール呼び出し）を書くため、「決めたのに実行に移れない」思考のループには中断・再試行より素直に効く。一方で、打ち切り時に残りの思考が本文へ漏れることがある（[llm].reasoning_budget のコメント参照）。
#   thinking_only: 思考だけを監視する。本文のループは検知しない（全く同じ応答を繰り返すループは [tool_loop_guard] が別途検知する）。
# content_only で [llm].reasoning_budget が空欄・-1（無制限）だと思考のループを止めるものが無くなるため、起動時に警告する。
target = all
# 判定対象とする直近テキストのウィンドウ文字数。
window_chars = 1000
# このバイト数増えるごとに再チェックする。
check_interval_chars = 150
# 上記条件が連続で何回成立したら確定でループと判定するか（誤検知防止）。
confirm_count = 2
# 周期に依存しない反復検知。直近window_chars文字が、それより前の履歴（最大max_history_chars文字に制限）の中にどれだけ長く一致する部分文字列を持つかを、difflib.SequenceMatcher.find_longest_match()で動的に測定する。
# 比較対象とする過去履歴の上限文字数。大きいほど長い周期の反復も検知できるが計算コストが増える。
max_history_chars = 4000
# match_ratio（直近ウィンドウとの最長一致長/window_chars）がこの値を上回ったら「反復的」の候補とみなす。
match_ratio_threshold = 0.6
# ループ検知後、注意メッセージを注入して再試行する最大回数（メイングラフ・サブエージェントで共通）。
# 下の empty_response_max_retries とは独立に消費される（src/graph.py の ainvoke_ensuring_final_text 参照）。大量ファイル処理のように1ターンで LLM呼び出しが数十〜数百回に及ぶタスクでは、序盤と終盤で独立した失敗が起きうるため、少し余裕を持たせている。複雑・情報量の多いタスクで思考がトークン上限に達して打ち切られるケースにも nudge_messages側の4件目（情報を分割し段階を踏んで考えさせる文言）で対応する。
max_retries = 12
# ループ検知後に注入する注意メッセージ（JSON/Python風のリスト（配列）形式で指定）。
# リトライ1回目には1つ目、2回目には2つ目…の順で使う。用意した数よりリトライ回数が多い場合は、以降はランダムに選ぶ（同じ文言の繰り返しで同じ堂々巡りを誘発しないため）。空リスト[]なら組み込みの既定文言を使う。
nudge_messages = [
    # 1回目：状態を整理させてから、そのまま続行
    "**ループを検知しました。** 一度手を止めて、①直近で実行した操作と実際の出力 ②現在のファイル/作業ツリーの状態 ③確定した事実と、まだ推測に過ぎない事、の3点を箇条書きで short に報告してください。報告したら**その事実に基づいて次の1手を実行し、タスクを継続してください**。",
    # 2回目：宣言を禁止し、最小の1手を即実行
    "**また同じ検討が繰り返されています。** 「〜します」という宣言文は書かないでください。次は、最も小さく結果が確認できる操作を**すぐに実行**してください。実行後、その出力が期待と一致したかを1行で判定し、判定結果に従って**続けて次の手順に進んでください**。",
    # 3回目：仮説を捨てて、別ルートで手を動かす
    "**同じ仮説に固執しています。** 今の原因仮説は誤っている前提で進めてください。まだ調べていない箇所を3つ挙げ、その中で最も検証コストが低いものを**今すぐ1つ検証**してください。検証が終わったら結果を1行で記録し、その後仮説の採用または修正に進んでください。停止は不要です。",
    # 4回目：行き止まりをマークし、別アプローチへ乗り換え
    "**行き詰まりです。** これまで試した手段と失敗理由を3行以内に圧縮し、それらを「試済み」として扱ってください。その上で、**これまでと異なるアプローチを1つ選び、確認を求めずにそのまま着手**してください。同じ手段の再試行は禁止です。",
    # 5回目：出力サイズを疑い、分割して進める
    "**出力を分割して継続してください。** 一度に全体を出力しようとして失敗している可能性があります。まず対象を作成・準備する操作を1回行い、以降は最小単位ずつ追記していってください。1メッセージにつきツールコールは1回。**完了するまで、この刻み方で手を動かし続けてください。**",
    # 6回目：スコープを削って、部分的にでも前進させる
    "**まだ進んでいません。** 完璧な解決を狙うのをやめ、ゴールを『次に確実に達成できる最小の一区切り』まで縮小してください。その最小ゴールを今すぐ達成し、達成できたら次の最小ゴールを設定して、**同手順で前進を続けてください。**",
    ]
# 無言終了（tool_calls も本文も空のAIMessage）を検知した場合に、最終回答を促して再試行する最大回数（メイングラフ・evalハーネスで共通。旧実装は app.py内にハードコードされていたが、上のmax_retriesと対になる兄弟設定のためここに置く）。上の max_retries とは独立に消費される（全体の試行回数は両者の合計+1が上限）。ローカルモデルはツール呼び出しのXMLを本文へ書いてしまい空応答になることが散発的にあり、再試行すれば直ることが多い。
# create_plan/approve_plan/update_task_progress のような状態確認だけのツール結果の直後に空応答が連続することがあり、1回あたりのコストは低い（空応答からのリトライは即座に完了する）ため、序盤の消費に余裕を持たせる目的で増量してある。
empty_response_max_retries = 5

[tool_loop_guard]
# 全く同じ応答（本文とツール呼び出しの名前・引数）を連続で繰り返すループを検知する機能の設定（src/tool_loop_guard.py）。小型ローカルモデルは、ツールの結果（特にエラー）を読んでも全く同じ応答を繰り返すことがある（eval で同じ応答を30回連続で出し、トークン上限まで消費した例あり）。ツールの結果やエラーかどうかは比べない。思考（thinking）は毎回揺れるため比べない。
# 検知したら [thinking_loop_guard] と同じ仕組みで回復させる: nudge_messages の注意メッセージに「何を繰り返したか」を添えて再試行し、max_retries（思考のループと合算）に達したら停止してユーザーに通知する。サブエージェントは、上限に達したらそこまでの経過を返して打ち切る。
# 再試行の前に、繰り返した応答とその結果は会話履歴から取り除く（残すと、モデルが注意を読んでも履歴の同じ呼び出しを書き写し続けるため）。
# また、引数に tool_call の書式（</parameter> 等）が漏れた呼び出しは、この設定に関係なく常に実行せずエラーを返す。
# モデルにツール呼び出しを強制する方法（tool_choice）は Qwen3.6 では効かないため使わない。
enabled = true
# 全く同じ応答が何回連続したらループとみなすか。1以下なら無効。
max_repeats = 3
# このツールだけを呼ぶ応答は数えない（状態確認のポーリングのように、同じ呼び出しを正当に繰り返すツール。リスト形式）。
exclude_tools = ["check_script_job", "check_dispatch_agent_job"]
# ループ検知後に注入する注意メッセージ（JSON/Python風のリスト（配列）形式で指定）。
# 1回目には1つ目、2回目には2つ目…の順で使い（思考のループとは別に数える）、用意した数より多い場合は以降ランダムに選ぶ。各メッセージの末尾には「何を何回繰り返したか」と、その結果の抜粋が自動で添えられる。空リスト[]なら組み込みの既定文言を使う。
nudge_messages = [
    # 1回目：結果を読み直させ、それに従った別の呼び出しへ
    "**同じツール呼び出しを繰り返しています。** 直前の結果をもう一度読み、書かれている指示やエラーの原因を1行でまとめてください。まとめたら、それに従った**別の呼び出し**を実行して、タスクを続けてください。",
    # 2回目：同じ呼び出しでは結果が変わらないことを明示し、選択肢を示す
    "**まだ同じ呼び出しが続いています。** 同じツールを同じ引数で呼んでも結果は変わりません。引数を変える・別のツールを使う・必要な前提（計画の承認など）を先に済ませる、のどれかを選んで**すぐに実行**してください。",
    # 3回目：別アプローチへ乗り換えるか、ユーザーへ報告して終える
    "**このやり方では進みません。** これまでの呼び出しは「試済み」として扱い、まったく別のやり方を1つ選んで着手してください。どうしても進められない場合は、ツールを呼ばずに、何が原因で止まっているかをユーザーへ報告して終了してください。",
    ]

[thinking_control]
# ReActループの各ステップで、直前の履歴の形から思考（thinking）レベルを機械的に選び、リクエストごとに切り替える機能の設定（src/llm/thinking_control.py）。Read/Grep成功直後のようなルーチン的なステップの思考を抑えて応答を速くする目的。
# レベルは off / low / medium / high / xhigh の5段階。off は enable_thinking=false、それ以外は思考予算（llama-server: reasoning_budget_tokens / vLLM: thinking_token_budget）の大小で表す。どちらもプロンプトの先頭部分を変えないため、KVキャッシュは外れない。
# [llm].reasoning_effort はステップごとには切り替えない（Qwen3.6 の公式テンプレートは読まず、対応させるテンプレートはシステムプロンプトへ指示文を足すため、切り替えるとキャッシュが外れる）。
# 機能全体のON/OFF。false なら従来と全く同じリクエストになる。[llm].enable_thinking = false または reasoning_effort = none のときは true でも働かない。
enabled = false
# メインエージェント / サブエージェント（dispatch_agent）のループに適用するか。要約・圧縮のためのLLM呼び出しには常に適用しない。
apply_to_main = true
apply_to_sub = true
# --- 判定ルール（最後のユーザー発言以降を対象に、ルール1→5の順で最初に当てはまったものを使う） ---
# rule_* には、そのルールに当てはまったときのレベル（off / low / medium / high / xhigh）を書く。false にするとそのルールは無効になり、次のルールで判定する。全て false なら常に default_level になる。
# ルール1: 末尾がユーザー発言（ナッジ・ループ検知時の注意・トークンガードを含む）のとき。画像を読んだツールの結果として後から足される画像だけのメッセージは、ユーザー発言ではなくツール結果の続きとして扱う。
rule_user_turn = high
# ルール2: 直前のツール結果がエラー（ToolMessage.status="error"、または本文が error_prefixes で始まる）のとき。エラーの原因を考えさせるため、default_level 以上にするのが基本。xhigh の予算は既定で無制限のため、エラーのたびに思考が無制限になってよい場合だけ xhigh にする。
rule_tool_error = high
# ルール3: 直前 max_consecutive_reduced 回が全てこのレベル未満のとき（思考の少ない状態で方向がずれ続けるのを防ぐ安全弁）。通常は default_level と同じにする。
rule_consecutive_cap = high
# ルール4: 直前に呼んだツールが全て after_tools にあるとき（一覧にないツールが1つでも混ざればルール5へ）。Read/Grep成功直後のようなルーチン的なステップの思考を抑えるため、default_level より低くするのが基本。
rule_after_tools = low
# ルール5: どのルールにも当たらなかったとき。
default_level = high
# 各レベルの思考予算（トークン数、-1 = 無制限）。空欄なら [llm].reasoning_budget を使う。思考をなくしたい場合は 0 ではなく off レベルを使う（llama-server はリクエストの 0 を無視する）。
# 注意: 予算で思考が打ち切られると、残りの思考が本文へ漏れることがある（[llm].reasoning_budget のコメント参照）。予算を小さくするほど打ち切りが増えるため、evalで確認しながら下げる。
# vLLM では、予算（thinking_token_budget）を使うには起動時に --reasoning-parser の指定が必要（未指定だと HTTP 400 で拒否される。[llm].reasoning_budget が空欄でも、ここの予算は送られる）。また、Qwen3.5以降でツール呼び出しの引数の途中に思考終了の文字列が差し込まれる不具合の報告がある（vLLM issue #44676）。予算を小さくする場合は修正済みのバージョンか確認する。
budget_low = 1024
budget_medium = 2048
budget_high =
budget_xhigh = -1
# ルール4の対象ツール一覧（リスト形式）。起動時に存在しないツール名があれば警告する。
after_tools = ["Read", "Glob", "Grep", "json_query", "search_path_memory", "check_work_dir_status", "update_task_progress", "get_plan_status"]
# ルール2: ツールの結果がこの文字列で始まればエラーとみなす（リスト形式で複数可）。
error_prefixes = ["エラー"]
# ルール3: rule_consecutive_cap 未満がこの回数続いたら rule_consecutive_cap へ戻す。0以下なら戻さない。
max_consecutive_reduced = 3

[paths]
# 各種データ保存先パスの共通ベースディレクトリ。[paths] 配下の checkpoint_db/memory_dir/plans_dir、および他セクション（[log]/ [default_workdir]/[path_memory]/[chat_log]）の dir 系キーの値に${common_data_dir} と書くと、ここで指定した値に置換される（configparser標準の補間機能ではなく、src/config.py の load_config() が起動時に行う独自の文字列置換。セクションをまたいで使えるようにするための仕組み）。保存先ルートをまとめて変更したい場合はここだけ変更すればよい。
# ${instance} と書くと、起動中のインスタンス名（管理ツールから起動した場合はそのインスタンス名、app.bat で直接起動した場合は default。環境変数 LOCOHANE_INSTANCE で指定可能）に置換される。既定の ./data/${instance} により、インスタンスごとにデータ（スレッド・ログ・永続メモリー等）が data/<インスタンス名>/ へ自動で分かれる。${instance} は common_data_dir 自身と、${common_data_dir} を使える上記の各キーで使える。
# 対応する環境変数 COMMON_DATA_DIR で上書き可能（環境変数側の値は${common_data_dir} プレースホルダーの展開対象にはならない。素のパスを直接指定すること。${instance} は展開される）。
common_data_dir = ./data/${instance}
# スキル定義フォルダ（ここ配下の各サブフォルダの SKILL.md を起動時に走査する）。
skills_dir = ./skills
# エージェント種別定義フォルダ（skills_dir と同格。ClaudeCode の .claude/agents/*.md 相当）。ここ配下の各 *.md を dispatch_agent の agent_type 種別として起動時に走査する。
# 1ファイル = 1種別。frontmatterで name/description/tools を指定する（tools 省略時は既定のツール一式を継承する）。
agents_dir = ./agents
# プロジェクト固有の拡張ディレクトリ（ClaudeCode の .claude/ 相当）。
# 指定した各ディレクトリ配下の以下3つを起動時に自動検知する（いずれも存在しなくてもエラーにはならない）:
#   skills/      - skills_dir に追加でマージ走査される追加スキル（同名スキルが両方に存在する場合はこちら側が優先される）
#   agents/      - agents_dir に追加でマージ走査される追加エージェント種別（同名定義が両方に存在する場合はこちら側が優先される）
#   LOCOHANE.md  - システムプロンプトの {{project_instructions}} へ差し込まれるプロジェクト固有の追加指示（ClaudeCode の CLAUDE.md 相当）。
#                  存在しなくてもエラーにはならない（「（プロジェクト固有の指示はありません）」が差し込まれるだけ）。1ファイルあたり200行を超える場合は切り詰められる。
# 複数ディレクトリを指定したい場合は、[thinking_loop_guard].nudge_messages と同じ JSON/Python風リスト形式（角カッコ＋改行複数行OK）で指定する。指定順で後方のディレクトリが優先される（skills/agents はマージ、LOCOHANE.mdは見出し付きで連結。マージ・重複排除等は行わない）。例:
# project_locohane_dir = [
#     "./.locohane",
#     "./.locohane_team",
#     ]
# 要素を {"dir": ディレクトリ, "python": Python実行ファイル} の辞書で書くと、そのディレクトリ配下の skills/ にある .py スクリプト（run_script/run_script_background 経由）だけを専用のPython環境で起動する（[scripts].python より優先。python 省略時や文字列だけの要素は従来通り [scripts].python を使う）。python はパス区切りを含む場合のみプロジェクトルート基準の相対パスとして解決し、含まない場合（"python" 等のコマンド名）はそのまま使う。execute_python_code 系は対象外。例:
# project_locohane_dir = [
#     "./.locohane",
#     {"dir": "./.locohane_team", "python": "./.locohane_team/.venv/Scripts/python.exe"},
#     ]
project_locohane_dir = [
    "./.locohane",
    ]
# run_script/execute_python_code のサブプロセスへ渡す PATH の先頭に追加するディレクトリ（外部バイナリ実行ファイルの配置先）。コマンド名を素の状態で叩くスキルは、OS側のPATH環境変数へユーザーが手動登録していないと「コマンドが見つからない」で失敗する。ここに配置先を明示しておけば、evals・app.py実行時のどちらでも手動登録なしで呼び出せる（src/tools.py の _subprocess_env 参照）。
# project_locohane_dir と同じJSON/Python風リスト形式で指定する。存在しないディレクトリは無視される。
bin_path = []

# システムプロンプトのテンプレートファイル（{{skills}} にスキル一覧を差し込む）。
system_prompt_path = ./system_prompt/system_prompt.md
# LangGraph の会話状態（チェックポイント）を溜める SQLite ファイル。
checkpoint_db = ${common_data_dir}/checkpoints.sqlite
# 永続メモリーの保存先（user/feedback/project/reference のサブフォルダと MEMORY.md 索引を持つ）。
memory_dir = ${common_data_dir}/memory
# create_plan が detail_markdown 引数を渡した際に書き出す、実行計画の詳細 Markdownファイルの保存先。会話スレッドごとに1ファイルで、create_plan を呼ぶたびに上書き更新される（任意機能のため空でもエラーにはならない）。
plans_dir = ${common_data_dir}/plans
# help ツールが読み込んで返すヘルプ本文（ユーザー向け、Markdown）。
help_path = ./system_prompt/help.md

[checkpointer]
# LangGraphの会話状態を永続化するSQLite接続（aiosqlite、[paths].checkpoint_db）周りのタイムアウト設定。DB接続切れエラー（no active connection）の対策として導入。
# checkpointer操作（aget_tuple/aput_writes等）1回あたりのタイムアウト秒数。
# aiosqliteのバックグラウンドスレッドが固着すると内部ロックが永久に解放されず全操作がハングするため、この秒数で切り上げて _CheckpointerTimeout を送出し、checkpointer再構築（下記2値も参照）へフォールバックする（app.py の _TimeoutGuardedSqliteSaver._guarded 参照）。
op_timeout_seconds = 15
# checkpointer再構築時、旧DB接続をクローズする際のタイムアウト秒数。
# 旧接続のクローズが固着しても新接続への切り替え自体はブロックしない（超過時はログのみでリークを許容する。app.py の _rebuild_checkpointer 参照）。
close_timeout_seconds = 3
# アプリシャットダウン時、保留中の非同期タスク（on_messageのストリーム処理等）の完了を待つ最大秒数。この秒数を過ぎてもなお残っているタスクはキャンセルしてから後始末の完了を待ち、その後にDB接続を閉じる。先に接続を閉じてしまうと保留タスクのcheckpointer操作が ValueError: no active connection で失敗するため、必ずこの順序を守る（app.py の _close_checkpointer_gracefully 参照）。
shutdown_drain_timeout_seconds = 5

[chainlit_files]
# 生成ファイルの自動プレビュー添付（cl.Image、analyze_image の show_in_chat=True 引数含む）や、回答本文への画像埋め込み（app.py の_embed_local_images_as_session_urls）がブラウザへ配信する際に使う、Chainlit自身のセッションファイルディレクトリ（プロジェクト直下.files/<セッションID>/。パスはChainlitが管理しており、ここでは変更できない）の自動削除設定。Chainlit自身にもブラウザ切断時の削除処理はあるが、プロセス再起動等では確実に働くとは限らないため、他の data/* 配下と同様に日数ベースの自動削除を保険として用意する。
# ディレクトリ単位（セッションID配下ごと）で削除する点が他セクションと異なる。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[elements]
# provide_download/analyze_image(show_in_chat=True) 等の添付ファイル・回答本文への画像埋め込みを、スレッド再開・プロセス再起動後も表示できるよう永続化する保存先（src/thread_store.py の create_element/get_element、app.py の _embed_local_images_as_session_urls 参照）。
# [chainlit_files] のセッション一時配信とは別に、ここへ実体をコピー保存する。
dir = ${common_data_dir}/elements
# 保持日数。この日数を過ぎた（更新日時が古い）ファイルは自動削除する。
# 0 以下を指定すると自動削除を無効化する。
# 既定は0（無効）。[thread_store].retention_days の既定も0（スレッド無期限保持）であるため、ここだけ日数指定で自動削除すると、まだ一覧に残っている（削除されていない）古いスレッドの添付・埋め込み画像だけが先に消え、リンク切れ（404）になる。スレッド削除時のファイル削除は thread_store.py の delete_thread_row/cleanup_old_threads が個別に行うため、通常はこの値を変更する必要はない。[thread_store].retention_days を有効化して運用する場合など、スレッドの寿命より積極的にファイルだけ間引きたい場合のみ設定する。
retention_days = 0
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[images]
# 画像をLLMへ渡す前に縮小する際の、長辺のピクセル数の上限（analyze_image ツールが読み込む画像に効く。ユーザーがアップロードした画像もLLMが analyze_image で開いたときに縮小される）。
# 「DPI」ではなく長辺ピクセル数で指定しているのは、スマホ撮影のJPEGはDPI メタデータを持たない/当てにならない一方、Visionモデルが消費するトークン量は画素数でほぼ決まるため。値を下げるほど1回のサブエージェント委任で扱える枚数が増えるが、写真に写り込んだ細かい文字は読み取りにくくなる。
# 0 を指定すると縮小しない（元の解像度をそのまま送る）。
# 画像の長辺が既にこの値以下の場合は再エンコードせず元データをそのまま使う。
max_long_side_pixels = 2048
# 縮小後に再エンコードするJPEGの品質(1-95)。文字が写り込んだ画像を読み取らせる用途では下げすぎると判読できなくなるので85以上を推奨。
jpeg_quality = 85
# LLMの回答本文（Markdownテーブルのセル等）へ直接埋め込む画像プレビューの、長辺ピクセル数の上限。上記 max_long_side_pixels（Vision向け）とは別の、意図的に小さい値（app.py の _embed_local_images_as_session_urls が analyze_image(show_in_chat=True) 等と同じセッションファイル配信経路でブラウザへ渡す。セル内のサムネイル用途なので、表示帯域・ディスク使用量を抑える観点で小さめでよい）。
inline_preview_max_long_side_pixels = 192
# 上記サムネイルの再エンコード品質(1-95)。
inline_preview_jpeg_quality = 70
# 上記サムネイルの、長辺ピクセル数の下限。アイコンサイズ程度の小さい画像をそのまま埋め込むと視認できなくなるため、これより長辺が小さい画像はこの値まで拡大してから埋め込む。0 を指定すると拡大しない（元のサイズのまま。既定）。max_long_side_pixels 以下の値にすること。
inline_preview_min_long_side_pixels = 0

[default_workdir]
# エージェントの既定の作業ディレクトリ（run_script の cwd、スクリプトが生成するファイルの出力先の基準になる）。作業フォルダアイコンでセッション単位の作業ディレクトリが指定されなかった場合に使われる。
# 実際にはこの直下にスレッド専用フォルダ _tmp_<作成日時>_<スレッドID>/ が作られ、そこが作業ディレクトリになる。チャットでアップロードしたファイルも、作業フォルダの指定に関係なく常にこのスレッド専用フォルダの uploads/<送信日時>/ へ保存される（他のスレッドからは読めない）。
dir = ${common_data_dir}/temp
# 上記 dir 直下に溜まり続けるファイルの保持日数。この日数を過ぎた（更新日時が古い）ファイルは自動削除する。0 以下を指定すると自動削除を無効化する。ユーザーが ChatSettings で指定したセッション単位の work_dir は対象外（dir のみが対象）。
# スレッド専用フォルダ（_tmp_*）も、最後に更新されてからこの日数を過ぎるとアップロードしたファイルごと丸ごと削除される。アップロードした画像は会話へ直接埋め込まず保存先のパスだけを LLM へ渡すため、この日数を過ぎてから古いスレッドを再開すると、そのスレッドでアップロードした画像・ファイルはもう開けない（必要なら再度アップロードする）。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1
# 上記の dir（default_workdir）に加えて、書き込みサンドボックスガードが書き込み・削除を許可する追加のディレクトリ。運用者が用意した固定の共有出力先などを登録する用途（既定は空、書き込みサンドボックス原則そのものは変わらない）。
# 対象は run_script/run_script_background 経由のみ。execute_python_code/ execute_python_code_background（LLMが自由生成したコードをその場で実行するツール）は対象外で、常に従来通り work_dir/default_workdir 限定のままになる（危険度が高いため）。
# 各要素は {"dir": ディレクトリ, "allow_entries": [...]} の辞書形式。
# JSON/Python風リスト形式（角カッコ＋改行複数行OK、末尾カンマ許容、[thinking_loop_guard].nudge_messages と同じ記法）で複数指定できる。
#   dir          : 許可するディレクトリ（相対パスは本ファイルからの相対、絶対パスも可）。存在しないディレクトリは無視される。
#   allow_entries: そのディレクトリへの書き込みを許可する対象のリスト。
#                  [main_agent_tool_guard].allow_entries と同じ形式で、各要素は次の2種類のいずれか:
#                    - "ツール名"（ビルトインツール名。現状、書き込みサンドボックスガードを持つビルトインツールは run_script/run_script_background のみのため実質未使用だが、将来の拡張用に形式を合わせてある）
#                    - ["スキル名","スクリプトファイル名"]（run_script/ run_script_background 経由で呼ばれるスキルスクリプトのみを許可）
#                  空リストなら対象を問わず無制限に書き込み可（誰でも
#                  書き込める）。
# 登録したディレクトリはセッション・スレッドを問わず常時書き込み可能になる点に注意（work_dir/default_workdirのようなセッション専用の分離は効かない）。
# 例:
# allow_sandbox_dir = [
#     {"dir": "E:/shared_output", "allow_entries": [["excel-edit", "write_excel.py"]]},
#     ]
allow_sandbox_dir = []

[skill_creator]
# skill-creator スキルが作るドラフトスキル（未検証のスキル）の扱い（src/skill_drafts.py 参照）。
# ドラフトは <draft_dir>/<ユーザー名>/<スキル名>/ に作られ、作成したユーザー本人の会話でだけ、スキル名「<ユーザー名>/<スキル名>」としてスキル一覧に出る（新しいスキルはskill-creatorで作った次のメッセージから使える）。
# 本人のドラフトのスクリプトは、[plan].plan_approval_exempt_scripts・[main_agent_tool_guard] の設定に関係なく、計画承認なし・メインエージェントから直接実行できる（作成者はスキル開発の専門家とは限らないため。書き込み先は通常どおり作業ディレクトリに限られる）。
# 正式スキルへの反映は、スキル開発者が管理ツールのスキル研究室（[skill_lab]）で仕上げ、スキル安定化トライアウトに合格したものだけを、ドラフトを作ったインスタンス専用の置き場（[skill_lab].instance_locohane_dir）へ昇格させる（Claude Code の promote-skill スキルでも同じ規則で昇格できる）。ドラフトに修正が入るとそれまでの合格回数は0に戻る。昇格したドラフトは archive_dir へ移る。
# 昇格したスキルの scripts/*.py は、ドラフトのときと同じ挙動になるよう、そのインスタンスの config_overrides.json の [plan].plan_approval_exempt_scripts と [main_agent_tool_guard].allow_entries（max_calls=-1）へ追記する（トライアウトも追記済みと同じ設定で評価する）。
# ドラフト置き場。起動時のスキル走査対象（[paths].skills_dir / agents_dir / project_locohane_dir）と同一・包含関係にすると起動時にエラーになる（ドラフトが全ユーザーに公開されるのを防ぐため）。${common_data_dir} / ${instance} を使える。
draft_dir = ${common_data_dir}/skill_drafts
# 昇格したドラフトの退避先（<ユーザー名>/<スキル名>_<日時>/ へ _workspace ごと移す。作成者の一覧からは消える）。draft_dir と同じく、スキル走査対象・draft_dir と同一・包含関係にすると起動時にエラーになる。${common_data_dir} / ${instance} を使える。
archive_dir = ${common_data_dir}/skill_drafts_archive
# スキル安定化トライアウト（evals/run_all.py --repeat）の既定回数。昇格時は各ケースをこの回数だけ繰り返し、全回合格したものだけを合格とする。1以上の整数。
tryout_repeats = 10
# 他ユーザーのドラフトの扱い（本人のドラフトは常にすべて可能）。次の4値のいずれか:
#   hidden   - スキル一覧に出さない。読み取り・実行・書き込み・評価もできない（Read/Glob/Grep/execute_python_code 等からも読めない）。
#   listed   - スキル一覧には出す（使用不可と注記）。読み取り・実行・書き込み・評価はできない。
#   readable - スキル一覧に出し、読み取りもできる。実行・書き込み・評価はできない。
#   full     - スキル一覧・読み取り・実行・書き込み・評価のすべてができる。
other_users_drafts = hidden

[skill_lab]
# スキル研究室（管理ツールの「スキル研究室」タブ、admin/skill_lab/）で、研究テーマの対象インスタンス（昇格先）側に効く設定。本体インスタンスの config_overrides.json で上書きする。
# スキル調整ワーカー自身の設定は [skill_lab_worker] を参照。
# インスタンス専用の拡張ディレクトリ（スキル研究室・promote-skill の昇格先）。昇格したスキル・サブエージェントは <ここ>/skills/・agents/ へ、回帰テスト用のケース一式は <ここ>/evals/<テーマID>/ へ置かれる。
# 本体の起動時も、[paths].project_locohane_dir と同じく配下の skills/・agents/・LOCOHANE.md を自動検知し、project_locohane_dir のどれよりも後方（最優先）で常に走査する（project_locohane_dir を上書きしても外れない）。
# project_locohane_dir は全インスタンス共通だが、ここはそのインスタンスだけが見るため、組織別・役割別のインスタンスで互いのスキルが混ざらない（同梱スキルと同名なら、そのインスタンスでだけ置き換わる）。
# ${instance_dir} はインスタンスの設定フォルダ（[admin].instances_dir/<インスタンス名>、既定 instances/<インスタンス名>）、${instance}・${common_data_dir} も使える。
# 既定の instances/<インスタンス名>/ はインスタンスの削除で一緒に消える（管理ツールの削除ダイアログで警告する）。
instance_locohane_dir = ${instance_dir}

[skill_lab_worker]
# スキル調整ワーカー（管理ツールでインスタンスの種類を「スキル調整ワーカー」にしたもの、admin/skill_lab/worker.py）自身の設定。ワーカーの config_overrides.json で上書きする（本体インスタンスの設定画面には出ない）。
# ワーカーは研究テーマ（スキル・サブエージェント・ケースのまとまり。対象インスタンスの ${common_data_dir}/skill_lab/themes/ に置く）を評価し、失敗すれば AI が直して再評価するループを回す。
# 評価・AI 修正・judge・下書きは、研究テーマの対象インスタンスの設定（スキル・ガード・タイムアウト・[llm] の推論パラメータ等）をそのまま引き継ぐ。
# ワーカー独自に持つのは、LLM の接続先（[llm] main_url / sub_url / main_routing_strategy / sub_routing_strategy）、このセクションのループ上限、ワーカー自身のログ（[log]）だけ（管理ツールのワーカーの設定画面にもこれだけが出る）。
# スキル調整ループの最大反復回数（1反復 = 評価1回 + 失敗時の修正1回）。超えると「上限到達」で止まり、人の判断を待つ。
max_iterations = 8
# 1テーマのループに使ってよい最大時間（時間、小数可）。超えると「上限到達」で止まる。
max_hours = 6
# ワーカーが処理待ちのテーマを探す間隔（秒）。
poll_interval_seconds = 10
# 修正を頼むときに AI へ渡す資産ファイル1つあたりの最大文字数（超えた分は省略して渡す）。
fixer_max_file_chars = 20000
# 修正・judge を頼むときに AI へ渡すトランスクリプト（ツール呼び出しと結果）抜粋の最大文字数（1回分）。
transcript_excerpt_chars = 6000

[path_memory]
# パスメモリー（src/path_memory.py）が会話ごとのレジストリファイル（<thread_id>.json）を保存するディレクトリ。
dir = ${common_data_dir}/path_memory
# 保持日数。この日数を過ぎた（更新日時が古い）レジストリファイルは自動削除する。
# 「会話終了」を明示的に検知する手段が無いため、日数ベースで管理する。
retention_days = 1
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1
# 1会話あたりの登録上限件数。
max_entries = 10000
# search_path_memory ツールと「見つかりません」エラー時の候補提示で使う類似度（0.0〜1.0）の下限。これ未満の登録は結果に出さない。
# 上げるほど候補が厳選され、下げるほど誤字・表記ゆれに寛容になる（無関係なパスも混ざりやすくなる）。
search_min_score = 0.3
# 検索語がフルパスの場合に、類似度計算でファイル名部分を重視する割合（0.0〜1.0）。残りはフォルダ部分同士の類似度で補う。
# 例: 0.7 なら「ファイル名同士の類似度×0.7 + フォルダ同士の類似度×0.3」。検索語がファイル名・フォルダ名だけの場合は使わない。
search_filename_weight = 0.7

[vector_db]
# ベクターDB（社内文書の意味検索、src/vector_db/）の有効/無効（true/false）。
# true にすると search_documents / list_document_collections ツールが使えるようになる。文書の取り込みは設定ダッシュボードの「ナレッジ」タブで行う。
enabled = false
# ベクターの保存先。次の2値のいずれか:
#   sqlite_vec - 下記 dir 配下の vectors.sqlite に保存する（サーバー不要。既定）。
#   qdrant     - 下記 qdrant_url の Qdrant サーバーに保存する。
backend = sqlite_vec
# コレクションの定義・取り込み済みファイルの記録（catalog.sqlite）と、backend=sqlite_vec のときのベクター（vectors.sqlite）の保存先ディレクトリ。
# backend=qdrant でも catalog.sqlite はここに置く。
dir = ${common_data_dir}/vector_db
# backend=qdrant のときの Qdrant サーバーの URL（例: http://localhost:6333）。API キーが必要な場合は .env の QDRANT_API_KEY に書く。
# 完全オフラインで使うため、ローカルまたは LAN 内のサーバーを指定すること。
qdrant_url =
# Qdrant 上のコレクション名に付ける接頭辞。${instance} はインスタンス名に置き換わる。インスタンスごとに変えて、同じ Qdrant サーバーを共有しても混ざらないようにする。
# この接頭辞で始まらない Qdrant のコレクションには一切触れない。
qdrant_collection_prefix = locohane_${instance}_
# Qdrant への1リクエストあたりのタイムアウト（秒）。
qdrant_timeout_seconds = 30
# 埋め込み（embedding）を計算する推論サーバーの接続先。[llm] main_url と同じ形式のリスト（OpenAI 互換の /v1/embeddings を呼ぶ）。
# 例: llama-server を --embedding --pooling mean 等で別ポートに起動し、[{"base_url": "http://localhost:12440/v1", "api_key": "dummy-not-used", "model": "bge-m3"},]
# 複数書くと先頭から順に試し、接続できなかった場合だけ次へ切り替える。同じベクターを返す必要があるため、すべて同じ model にすること（start/end は指定不可）。
# enabled = true のときは必須（[] は未設定）。
embedding_url = []
# 埋め込みを1リクエストでまとめて計算するチャンク数。
embedding_batch_size = 16
# 埋め込み1リクエストあたりのタイムアウト（秒）。
embedding_timeout_seconds = 120
# 検索語・文書の先頭に付ける文字列。multilingual-e5 系・Nemotron-Embed 系のモデルでは query_prefix = "query: "、document_prefix = "passage: " にする（bge-m3 等は空のまま）。
# 接頭辞を変えたら、取り込み済みのコレクションは「ナレッジ」タブで再構築すること。
# 前後の空白も含めてそのまま付ける。値をダブルクォートで囲むと囲みを外して使う（末尾の空白を残したいとき用）。
query_prefix =
document_prefix =
# 文書を分割する1チャンクの目安の文字数。段落・改行の切れ目を優先して、この文字数を超えないように分ける。
chunk_size = 800
# 隣り合うチャンクで重複させる文字数（切れ目で文脈が途切れないようにする）。chunk_size より小さくすること。
chunk_overlap = 100
# 取り込む対象の拡張子（カンマ区切り）。対応形式: .pdf .docx .xlsx .xlsm .pptx .md .txt .csv
include_extensions = .pdf, .docx, .xlsx, .xlsm, .pptx, .md, .txt, .csv
# 1ファイルあたりの上限サイズ（MB）。超えるファイルは取り込まず、失敗一覧に理由を載せる。
max_file_mb = 50
# search_documents が既定で返す件数。
top_k = 5
# search_documents の結果全体の最大文字数。超えた分のチャンク本文は切り詰める（メインエージェントのトークン量を抑えるため）。
max_result_chars = 6000
# 結果に出す類似度（0.0〜1.0、コサイン類似度）の下限。これ未満のチャンクは返さない。
min_score = 0.3

[log]
# アプリログの出力先ディレクトリ。
dir = ${common_data_dir}/logs
# ログの詳細度。次の3値のいずれか:
#   info  - 現行仕様。各ツール呼び出しの概要（ツール名・要約引数）のみ記録する。
#   debug - info に加えて、ツール呼び出しの全引数・全結果、LLMの応答本文・thinking（reasoning_content）まで記録する（情報量・ファイルサイズが大きく増える。障害調査でモデルの挙動を忠実に追いたいときに使う）。
#           ※コンソールには一切出力されない（file_handler のみ）。
#           ※openai/httpx/httpcore/aiosqlite/asyncio 由来の DEBUG ログは抑制される。
#   none  - ログ出力を一切行わない（data/logs/app_*.log を含め何も生成しない）。
level = debug
# 起動のたびに新しい app_*.log ファイルを作成するか、直近の既存ファイルに追記を試みるか（true/false）。
# false（既定）: 直近の app_*.log への追記を試みる（既に max_lines を超えていれば、その場で新しいファイルにローテーションする）。
# true          : 起動のたびに必ず新しい日時つきファイルを作成する。
# level=none のときはログ自体を出さないため、このフラグは意味を持たない。
clear_on_startup = true
# app_*.log（上記 dir に出力されるアプリログ）1ファイルあたりの最大行数。この行数を超えたら、新しい日時つきファイル名（例: app_20260725_143012.log）へローテーションする。
# ファイル名の日時はローテーションのたびに「今」の日時で付け直す（起動時刻固定ではない）。同一秒に複数回ローテーションする場合は_1, _2... の連番を付けて衝突を避ける。
# 1レコード（例外トレースバック等）が複数行になる場合はその全行をカウントするため、閾値は「ファイルの実際の行数」を指す。level=none のときは app_*.log自体を生成しないため意味を持たない。
max_lines = 5000
# ローテーションで増え続ける古い app_*.log の保持日数。この日数を過ぎた（更新日時が古い）ファイルは自動削除する。0 以下を指定すると自動削除を無効化する。同じ dir に evals/run_case.py が書き出す evals.log は別扱いのため削除対象に含まれない。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[chat_log]
# 会話ログ（ユーザー発言とAIの最終応答）をテキストファイルへ記録する機能の有効/無効。
# false（既定）: 記録しない。
enabled = true
# 会話ログの保存先ルートディレクトリ。<dir>/<ユーザー名>/<日付>_<thread_id>.log の構成で書き出す。ユーザー名はログイン中のユーザー識別子（[auth] enabled=false の場合は "anonymous" にまとめる）。
dir = ${common_data_dir}/logs_chat

[thread_store]
# 会話スレッド一覧（画面左サイドバー）・過去の会話を選んで再開する機能の有効/無効。
# true（既定）: 有効。false にするとサイドバー自体が表示されなくなり、機能追加前と同じ単一セッションの挙動に戻る。
enabled = true
# スレッド一覧・Step履歴の保存先SQLiteファイル。data/checkpoints.sqlite（LangGraphの会話状態そのもの）とは別ファイル。一覧表示・再開に必要なメタデータのみを持つ軽量なストア。
db = ${common_data_dir}/chat_threads.sqlite
# スレッド一覧の保持日数。この日数の間更新が無いスレッドを自動削除する。
# 0以下（既定）で無効化＝無期限保持。削除してもLangGraph側の会話状態（checkpoints.sqlite）自体は消さない（一覧に出なくなるだけ）。
retention_days = 0
# 上記の自動削除チェックの実行間隔（時間）。
cleanup_interval_hours = 1

[chat_starters]
# チャット開始時に表示する定型文ボタン。クリックするとそのままメッセージとして送信され、タスクが開始する。[thinking_loop_guard].nudge_messages と同じJSON/Python風リスト形式（角カッコ＋改行複数行OK、末尾カンマ許容）で指定する。空リスト[]ならボタンを表示しない。
prompts = [
    "使い方を教えて",
    "Office系、PDFが作成、編集できるって本当？",
    "Excel マクロ(VBA)の作成・編集ができるって本当？",
    ]

[user_response_timeouts]
# ユーザーの応答待ち（Chainlit の cl.AskActionMessage/cl.AskUserMessage）のタイムアウト秒数。いずれも未応答の場合は安全側に倒す（承認系はタイムアウト、質問系はエラー扱い）。[scripts].timeout（スクリプト/コード自体の実行タイムアウト）とは別物。
# create_plan で作った計画への承認（approve_plan）の待ち時間。
# 0 を指定すると無期限待ちになる。
approval_seconds = 0
# AskUserQuestion（自由記述の質問。labels省略時は単発質問、labels指定時は複数項目フォーム）の待ち時間。0 を指定すると無期限待ちになる。
ask_user_question_seconds = 0
# ask_user_choice（選択肢形式の質問）の待ち時間。0 を指定すると無期限待ちになる。
ask_user_choice_seconds = 0

[plan]
# 送信ボタン付近に表示する Plan Mode / Edit Automatically バッジをクリックしたときの挙動。
# true : 双方向切り替え可能（Plan Mode → Edit Automatically も含む）。
#        approve_plan によるユーザー承認プロセスを経ずに、クリック一発で書き込み系ツールのロックを解除できる。
# false: Edit Automatically → Plan Mode への一方向のみ許可（ロックする方向のクリックのみ有効）。Plan Mode → Edit Automatically への解除はバッジのクリックでは行えず、必ず approve_plan（LLM経由のユーザー承認フロー）を通す必要がある。双方向切り替えで弊害が出た場合の安全弁として false に変更する。
allow_badge_unlock = true
# approve_plan の承認をユーザーへ確認せず自動で行うかどうか。
# true : approve_plan が呼ばれた時点で承認/却下ボタンの表示・応答待ちを一切行わず、その場で自動的に承認済み扱いにする。以後 run_script/run_script_background/execute_python_code/ execute_python_code_background のハードブロックが人の確認なしに解除される。
# false（既定）: 従来通り、承認/却下ボタンを表示してユーザーの明示的な応答を必須にする。
auto_approve = true

# create_plan を呼んだ時点で、既に Edit Automatically（計画承認済み）状態だった場合の挙動。
# true : 常に Plan Mode へ強制的に戻す。承認済みの計画があっても create_plan を呼び直すたびに plan_approved が無条件でリセットされ、approve_plan による再承認が必須になる。
# false: 既に承認済みだった場合はそのまま Edit Automatically を維持し、新しい steps だけを差し替える（approve_plan を再度呼ばなくても書き込み系ツールを続行できる）。計画未承認の状態から呼んだ場合は true/false に関わらずこれまで通り Plan Mode のまま（approve_plan が必要）。承認済み計画の途中で create_plan を呼び直す運用が多く、そのたびの再承認が過剰だと感じる場合に false へ変更する。
reset_approval_on_recreate = false

# 新しいユーザーメッセージを受け取るたびに、plan_approved を無条件で Plan Mode（未承認）へ戻すかどうか。
# true : 常に戻す（既定・従来挙動）。計画承認は「そのユーザーメッセージへの応答で作られた計画の実行」に限定されるスコープとみなし、放置された古い計画が次のメッセージへ持ち越されないようにする安全策。
# false: 承認済み状態をメッセージをまたいで維持する。thinking_loop_guard がリトライ上限に達して打ち切られ、ユーザーが「続けて」等の新しいメッセージを送って同じタスクを継続する場合でも、承認済みの計画を create_plan/approve_plan からやり直させられずに済む。無関係な新規依頼を送った際も前回の承認状態が残ってしまう点に注意。
reset_approval_on_new_message = false

# run_script/run_script_background の計画承認（Plan Mode）を免除する読み取り専用スクリプトのホワイトリスト。[["スキル名","スクリプトファイル名"], ...]のPython/JSON風リスト形式で指定する（末尾カンマ可）。空欄なら下記の既定7件を使う。
# 対象は「副作用のない読み取り専用スクリプト」に限定すること（書き込み系スクリプトを追加すると計画承認なしに書き込みが実行されてしまうため注意）。
plan_approval_exempt_scripts = [
    ["excel-vba-read","read_vba.py"],
    ["excel-read","read_excel.py"],
    ["excel-render","render_excel.py"],
    ["docx-read","read_docx.py"],
    ["docx-render","render_docx.py"],
    ["pdf-tools","read_pdf.py"],
    ["pdf-tools","render_pdf_pages.py"],
    ["pptx-read","read_pptx.py"],
    ["pptx-inspect","inspect_pptx.py"],
    ["pptx-render","render_pptx.py"],
    ["web-search","search_web.py"],
    ]

[auth]
# ログイン認証機能のON/OFF。
# false（既定）: ログイン不要（現状通り、誰でもそのまま使える）。
# true          : 起動時にログイン画面が表示され、.env の AUTH_USERS に登録したユーザー名/パスワードでのログインが必須になる。
# ユーザー名・パスワードの実体、および必須の CHAINLIT_AUTH_SECRET は.env（環境変数）側で管理する（機密情報は config.ini に置かない方針のため、ここには ON/OFF フラグのみを置く。詳細は .env.example / README_DETAIL.md 参照）。
enabled = false
# enabled=true のときのパスワード必須/不要の切り替え。
# true（既定） : ユーザー名とパスワードの両方が .env の AUTH_USERS の登録内容と完全一致しないとログインできない。
# false        : ユーザー名さえ AUTH_USERS に登録済みであれば、パスワードは何を入力しても（空でも）ログインできる。社内LAN等、ネットワーク到達性自体で十分に閉じており、ユーザー名だけで作業者を区別・記録できれば足りる環境向けの緩和スイッチ。
require_password = false

[ui]
# チャット画面（フロントエンド）のメインスレッドに描画するメッセージ（ユーザー発言/AI応答、cl.Message のステップ単位）の最大件数。
# 上限を超えた古いメッセージは画面表示から切り捨てられるだけで、LLMへ渡す会話コンテキストや会話ログ（[chat_log]）には一切影響しない（表示専用の間引き。frontend/src/App.tsx 参照）。
# 0 を指定すると無制限（従来どおり全件描画）。
max_display_messages = 50
# サイドパネル（右側、ツール呼び出し等のStep一覧）に描画するStepの最大件数。
# 上限を超えた古いStepは画面表示から切り捨てられるだけで、LLMへ渡す会話コンテキストや会話ログには一切影響しない（表示専用の間引き）。
# 0 を指定すると無制限（従来どおり全件描画）。
max_display_side_steps = 50

# --- 入力欄（Composer）の貼り付け・文字数上限 ---
# この文字数以上のテキストを入力欄へ貼り付けると、入力欄には展開せず「貼り付けテキスト」カード（pasted-text-<時刻>.txt の添付）として扱う。
# 巨大なテキストを textarea に直接流し込むとブラウザが固まるための対策。
# 送信時はファイルパスではなく本文としてLLMへ渡す（app.py の_build_human_message 参照）。0以下を指定すると無効化（従来どおり全文を入力欄へ展開する）。
paste_as_attachment_threshold_chars = 2000
# 1回の送信で受け付ける最大文字数（入力欄の本文＋貼り付けテキストの合計）。
# 超過中は送信ボタンが無効になり、バックエンドも超過した送信を拒否する。
# 日本語は概ね1文字≒1トークンのため、LLMサーバーのコンテキスト長（llama-server の --ctx-size）からシステムプロンプト・ツール定義・回答に使う分を差し引いた範囲に収めること。0以下を指定すると無制限。
max_input_chars = 30000

# --- トークン使用量カードの強調表示 ---
# サイドパネルの「トークン使用量」カードで、「リクエスト1回あたり」行（直近1回のLLM呼び出し分。累計行は対象外）の合計トークン数（total）がこの値以上になったら、行全体をオレンジ太字で強調表示する。あくまで表示専用の警告であり、[llm].max_tokens等の実際の生成上限には影響しない。
# 0以下を指定すると無効化する。
token_usage_warn_threshold = 48000
# 上記と同じ判定対象（「リクエスト1回あたり」行の合計トークン数）がこの値以上になったら、行全体を赤太字で強調表示する（token_usage_warn_threshold より優先。0以下を指定すると無効化する）。
token_usage_alert_threshold = 81920

# --- 作業フォルダ（入力欄の📁アイコン）のパス候補 ---
# 作業フォルダの入力欄に2文字以上入力したときに表示する、サーバーPC上のフォルダ候補の最大件数。
# 0以下を指定すると候補を表示しない。
work_dir_max_suggestions = 100

[websocket]
# ブラウザ⇔サーバー間のWebSocket（Socket.IO）接続の生存確認間隔・タイムアウト。
# [llm].stream_chunk_timeout_seconds（LLMサーバーとの通信タイムアウト）とは別レイヤーの設定で、chainlit本体（chainlit/server.py の`socketio.AsyncServer(...)`）はこれらを指定していないため、未設定時は python-socketio/engineioのデフォルト（25秒間隔・20秒タイムアウト）が使われる。
# LLM応答待ちでイベントループがブロッキング気味になる時間帯（dispatch_agentの長時間実行中など）に20秒のping_timeoutを超えると、バックエンド処理自体は継続しているにもかかわらずWebSocketが切断され、再接続までStep更新がUIのタイムライン（サイドパネル）に反映されない不具合が起きうる。
# サーバーが何秒間隔でpingを送るか。
ping_interval_seconds = 25
# 直近のpingへの応答（pong）をこの秒数待っても受信できない場合に切断とみなす。
# 値を大きくするほど瞬断・応答遅延に強くなるが、本当に接続が死んだ場合の検知が遅れる（その間はメッセージ送達不可のまま残る）。
ping_timeout_seconds = 120

[mcp]
# .locohane/settings.json の mcpServers に定義された全MCPサーバーへの自動接続機能そのものの有効/無効。false ならファイルの有無に関わらず一切接続しない（.locohane/settings.json の "mcp"."enabled" があればそちらが優先。ここは settings.json に指定が無い場合のデフォルト値）。
enabled = true
# .locohane/settings.json のパス（相対パスはプロジェクトルート基準）。
# Claude Code / Qwen Code の mcpServers 設定形式を参考にした、stdioトランスポート専用のMCPサーバー接続設定ファイル（src/mcp_client.py 参照）。
settings_path = ./.locohane/settings.json
# 1サーバーあたりの起動（プロセス起動 + initialize + tools/list）のタイムアウト秒数。超過したサーバーは接続失敗として扱いスキップする（アプリ起動は継続する）。
connect_timeout_seconds = 15
# MCPツール（tools/call）1回あたりのタイムアウト秒数。
call_timeout_seconds = 60


[admin]
# 設定ダッシュボード（管理ツール、admin/ パッケージ、admin.bat）自身の設定。
# Locohane本体（app.py）とは別プロセス・別ポートで動く。ここの値は、instances/<name>/config_overrides.json（管理ツールでインスタンスごとに変更した設定の上書き差分。詳細はREADME_DETAIL.mdの「設定ダッシュボード」参照）の上書き対象にはならない（管理ツール自身の起動設定のため、循環を避ける）。
# 管理ツールを起動する前に有効になっている必要があるため、環境変数 ADMIN_HOST 等でのみ上書き可能（config_overrides.jsonでは上書きできない）。
#
# 管理ツールの待受ホスト。既定はローカルのみ。0.0.0.0にするとLAN上の他端末からも到達可能になるが、下記 ssl_certfile/ssl_keyfile を設定してHTTPS化しない限りログインパスワードが平文でネットワークを流れる。HTTPS化するか、社内LAN等、経路上の盗聴リスクを許容できる場合を除き変更しないこと。
host = 127.0.0.1
# 管理ツールの待受ポート。
port = 7999
# HTTPS用のサーバー証明書（PEM）と秘密鍵（PEM）のパス。両方指定すると、管理ツールと、管理ツール・app.bat から起動する本体インスタンス（chainlit の --ssl-cert/--ssl-key）が同じ証明書でHTTPSで待ち受ける。両方空ならHTTP（既定）。片方だけの指定やファイルが無い場合は起動を拒否する。相対パスはプロジェクトルート基準。環境変数 SSL_CERTFILE / SSL_KEYFILE で上書き可能。
ssl_certfile =
ssl_keyfile =
# 管理ツールへのログインセッションの有効時間（分）。
session_timeout_minutes = 60
# config.ini/public/settings/.env のバックアップ（instances/<name>/backups/）を、インスタンスごとに何世代まで残すか。超過分は古い順に削除する。
backup_keep = 20
# 管理ツール終了時に、そこから起動した本体インスタンス（子プロセス）も道連れで停止するか。false（既定）なら管理ツールを終了しても本体は動き続ける（管理ツールを再起動すると「外部で起動中」として検知される）。
stop_apps_on_exit = true
# インスタンス別ディレクトリ（instance.json・config_overrides.json・.env・settings/・backups/・app_stdout.log、および admin_changes.log）のルート。相対パスはプロジェクトルート基準。管理ツールだけでなく、app.bat での直接起動時の default インスタンスの .env・config_overrides.json の読み込み先にも使われる。環境変数 INSTANCES_DIR で上書き可能。変更した場合、既存の instances/ の中身は手動で移動すること（自動移行はしない）。
instances_dir = ./instances
