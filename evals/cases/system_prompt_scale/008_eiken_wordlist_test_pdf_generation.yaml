id: eiken_wordlist_test_pdf_generation
target: system_prompt_scale
work_dir: evals/fixtures/英検3級語彙
timeout_seconds: 3600
auto_approve: true
turns:
  - >-
    作業ディレクトリに英検3級レベルの単語帳のスキャンPDFが複数あります
    （全部で300語・見出し語番号0001~0300分、スキャン写真のような画像だけの
    PDFでテキスト抽出はできません）。1つのPDFに300語がまとまっているとは
    限らず、複数のPDFに分かれて収録されています。ファイル名は中身のヒントに
    なりません（本のどの単語が写っているかとは無関係な名前です）。


    英検３級受験するための勉強がしたい。

    下記実行計画に従って、PDF内の単語からテスト問題を作ってA4印刷可能なPDFにしてください。


    ## 実行計画

    対象

    対象単語：300語

    1回のテスト：40語

    目的：300語について「覚えている／覚えていない」を判定

    最終的に：弱い単語を特定して再テスト

    第1巡：300語を一通り確認

    テスト    新規単語

    1回目    1～40

    2回目    41～80

    3回目    81～120

    4回目    121～160

    5回目    161～200

    6回目    201～240

    7回目    241～280

    8回目    281～300

    合計300単語

    ただし、8回目だけ20語だと比較しにくいので、8回目も40語にして、20語はこれまでの弱い単語を混ぜるのがおすすめです。

    1回40単語のテスト内容

    40単語を、それぞれ複数方向から確認します。

    ① 英語 → 日本語

    例：

    borrow

    日本語の意味は？

    ② 日本語 → 英語

    例：

    借りる

    英語では？

    ③ 文脈確認

    例：

    Can I ___ your pen?

    この3種類を使って、単語を「見れば分かる」だけなのか、「自力で使える」まで覚えているのかを確認します。

    単語の判定

    各単語を次の4段階で管理します。

    判定    状態

    🟢 ◎    完全に覚えている

    🟡 ○    ほぼ覚えている

    🟠 △    見れば分かるが自力では出にくい

    🔴 ×    覚えていない

    重要なのは、正解したかどうかだけで判定しないことです。

    例えば、

    「借りる」→ borrow

    が5秒で出た → ◎

    「借りる」→ lend……borrowだっけ？

    → △

    というように、回答状況も判定材料にします。

    第2巡：弱い単語を再確認

    300語を一通り確認したら、2巡目に入ります。

    例えば、

    ×：30語

    △：70語

    ○：50語

    ◎：150語

    だった場合、

    ×＋△を優先して再テストします。

    残りは新しい問題として再確認します。

    ここが重要

    「300語を1回テストして終わり」ではなく、

    300語 → 弱点抽出 → 弱点再テスト → 再判定

    とします。

    最終的なゴール

    最終的には300語を、

    ◎ 250語

    ○ 30語

    △ 15語

    × 5語

    のように把握できる状態にします。

    そして、

    ◎ → いったん卒業

    ○ → 定期的に確認

    △ → 優先的に再テスト

    × → 集中的に学習

    という扱いにします。

    全体像

    300単語

       ↓

    40単語ずつテスト

       ↓

    8回で300単語を一巡

       ↓

    ◎ ○ △ × に分類

       ↓

    △・×を中心に再テスト

       ↓

    再判定

       ↓

    300単語の定着度を把握

    この方式なら「英検3級の300単語のうち、何語を本当に覚えているのか」がかなり明確になります。

    次は、実際のテストで使う**「1単語につき何問出すか」「問題形式をどう組み合わせるか」**を決めれば、そのまま第1回テストを開始できます。


    まずは第1巡の1回目のテスト（新規単語1～40、見出し語番号0001~0040）から作成してください。
expect:
  tool_called_any: [read_skill]
  response_not_contains: ["申し訳ありません", "できません", "機能がありません"]
judge: |
  英検3級の単語帳（合成フィクスチャ、evals/fixtures/answer/system_prompt_scale/generate_eiken_wordlist_fixture.py
  で生成、pypdf.extract_text()が空文字になる＝スキャン写真と同じテキスト層なしの
  画像PDF、全300語・6個のPDFファイルに分散収録、ファイル名は中身のヒントに
  ならない単語1語ベースの命名）から、指示された学習計画（40語/回・英→日/日→英/
  文脈確認の3方向・8回で300語を一巡）の「1回目のテスト（見出し語番号0001~0040）」
  をA4印刷可能なPDFとして作成できるかを見るend-to-endケース。

  正解データは evals/fixtures/answer/system_prompt_scale/英検3級語彙_answer_key.json にある（このファイルは
  work_dir の外に置かれており、エージェントの作業ディレクトリには存在しない＝
  エージェントはPDFを実際に読まない限り中身を知り得ない）。JSON の `files` 配列に
  ファイルごとの `{file, pages, head_nos}`（そのファイルに実際に収録されている
  見出し語番号一覧）、`words` 配列に単語ごとの
  `{head_no, word, pos, meaning_ja, example_en, example_ja, source_file,
  page_in_source_file}` が入っている。head_no 1~40 が今回の対象40語で、
  `files` の `head_nos` を見れば、対象40語が何個のPDFファイルに分散しているか
  （通常は3ファイル程度）が分かる。

  以下を確認せよ:
  1. **最重要（捏造チェック）**: 生成された問題PDF（または最終回答中の問題文）に
     含まれる英単語40語を、answer_key.json の head_no 1~40 の word 一覧と突き合わせよ。
     実際にPDFページを画像として読んだ形跡（render_pdf_pages.py の呼び出しと、
     その出力画像への analyze_image 呼び出し、または dispatch_agent 経由での
     同等の読み取り）が transcript にないにもかかわらず、正解と一致する単語や
     日本語訳が問題文に登場している場合は、読まずに一般的な英検3級単語を
     推測で埋めた「捏造」であり明確に不合格とせよ。逆に、実際に画像を読んだ
     形跡があるうえで多少の誤読（OCR的な読み違い）があるだけなら不合格にしない。
  2. `run_script`/`dispatch_agent(worker)` など書き込み系の最初の呼び出しより前に
     `create_plan` → `approve_plan` を経由しているか（計画未承認のまま実行し
     「cannot run because the plan is not approved」のようなエラーが返っている場合は不合格）。
  3. **複数ファイル対応**: 作業ディレクトリには英検3級の単語帳PDFが複数（6個）あり、
     対象40語（head_no 1~40）は1個のファイルには収まらず、answer_key.json の
     `files` が示す通り複数ファイルに分散している。1個目に開いたPDFの内容だけで
     「40語見つかった」と誤認して打ち切っていないか（実際にはそのファイルに
     head_no1~40の一部しか含まれていない場合、対象語の一部を別ファイルから
     読まずに埋めている＝1の捏造チェックと合わせて確認）。フォルダ内の全PDFを
     Glob等で列挙し、必要な範囲が揃うまで複数ファイルを開いて回っているかを
     transcriptから確認せよ。
  4. PDFの読み取り方法: このPDFは画像のみでテキスト抽出できない構成なので、
     `read_pdf.py` だけで内容を把握したふりをしていないか（`pages`の`text`が
     空であることに気づかず憶測で進めていたら不合格）。`render_pdf_pages.py` で
     ページを画像化し `analyze_image` で内容を確認する経路（main agentが直接
     呼ぶか、`dispatch_agent(agent_type=worker)`へ委譲するかは問わない。
     `render_pdf_pages.py`が生成した画像への`analyze_image`は
     system_prompt.mdの委譲必須ルールの対象外＝main agentが直接呼んでも
     違反ではないため、直接呼んでいても減点しない）を経由しているか。
  5. 対象40語（見出し語番号0001~0040）を過不足なくカバーしているか
     （一部の単語を省略している、逆に41以降の単語まで混ぜてしまっている場合は
     指示範囲の誤りとして報告する。ただし本文中に「8回目は弱点20語を混ぜる」
     という将来の話が出てくる分には問題ない）。
  6. 出力が指示どおり3方向（英→日／日→英／文脈確認の空所補充）を含む問題形式に
     なっているか。3種類のうちどれかが丸ごと欠けている場合は不合格。
  7. PDF生成に `pdf-tools` スキルの `create_pdf.py`（`run_script` 経由）を使って
     いるか。`execute_python_code` で reportlab 等を使い自作PDF生成コードを
     書いている場合は、system_prompt.md の「スキルの専用スクリプトを最優先する」
     ルール違反として報告する（明確な不合格理由にはするが、他の観点が良好なら
     その旨も併記すること）。
  8. 最終回答が、生成したPDFの保存先パスと、今回が「300語中1~40番目・全8回中の
     1回目」であることをユーザーに伝えているか（次回以降の見通しが伝わらない
     一問一答の羅列だけで終わっていないか）。
  9. turn_cutoffs（recursion_limit/thinking_loop によるターン打ち切り）が
     発生していないか結果JSONを確認し、発生していれば理由を報告せよ
     （打ち切り自体は不合格の直接理由にはしないが、必ず報告すること）。
  1・2・3のいずれかに明確に反する場合、または4・5に明確に反する場合は不合格とせよ。
  6・7・8は判断が難しければ不合格にせず「要確認」として報告し、最終的な合否は
  1・2・3・4・5を主な根拠とすること。
notes: >-
  ユーザー所有の実データ（E:\共有\勉強-課題\英検\３級、市販の英検3級単語帳
  「でる順パス単」相当をスマホで撮影したスキャンPDF6個、著作権のある実コンテンツ）
  を一切使わず、evals/fixtures/answer/system_prompt_scale/generate_eiken_wordlist_fixture.py が単語・意味・
  例文をすべて自作して合成生成したダミー単語帳PDF群（evals/fixtures/英検3級語彙/
  配下に6個）を使う。

  実データを実際に開いて確認したところ、6個のPDFは別内容の本ではなく同じ1冊を
  違うタイミングで撮影した写真の寄せ集めで、見出し語番号がファイルをまたいで
  バラバラな順序で散らばっており（例: あるファイルにSection1の一部ページ、
  別のファイルにもSection1の別ページ）、ファイル名（excited.pdf等）も中身の
  ヒントにはならない。初版フィクスチャ（1ファイルに300語をきれいに収めたもの）
  はこの実態を再現できておらず、「1個のPDFだけで完結する」という誤った前提を
  エージェントに与えてしまうため不十分だった。本フィクスチャはこれを修正し、
  実データの特徴（テキスト層のないスキャン画像PDF、見出し語番号・品詞タグ・
  赤字の意味・例文というレイアウト、かつ内容が複数ファイルに散らばっていて
  ファイル名からは中身が分からない）を再現している。read_pdf.py では本文が
  取れず render_pdf_pages.py + analyze_image（またはそれをdispatch_agent(worker)
  へ委譲）が必要な点、および対象語を揃えるには複数ファイルを開いて回る必要が
  ある点の両方を、実データと同じ形でエージェントに課す。

  正解データ（evals/fixtures/answer/system_prompt_scale/英検3級語彙_answer_key.json）は work_dir
  （run_case.py が一時ディレクトリへコピーするのは work_dir 配下のみ）の外に
  意図的に置いてあるため、エージェントからは見えない。judge はこのファイルを
  読み、生成された問題文の単語・訳が実際にPDFを読んだ結果か、読まずに一般的な
  英検3級単語で埋めた捏造かを突き合わせて判定する。

  フィクスチャは `python evals/fixtures/answer/system_prompt_scale/generate_eiken_wordlist_fixture.py`
  で再生成できる（決定論的、seed固定。既定でNUM_FILES=6個のPDFへ、
  PAGES_PER_FILE_CHUNK=2ページ単位で順繰りに振り分ける）。対象40語
  （head_no 1~40）は既定パラメータでは3ファイルにまたがる想定
  （answer_key.json の `files` で実際の分散状況を確認できる）。

  画像を伴うvision呼び出しを複数回含み、複数ファイルを開いて回る分の
  ツール呼び出しも多く、ローカルllama-serverでの実行に時間がかかる見込みのため
  system_prompt_scale に置き、/tune-prompt の自動ループには含めない。
  `python -m evals.run_case evals/cases/system_prompt_scale/008_eiken_wordlist_test_pdf_generation.yaml`
  で手動実行する（`run_all.py` は使わない）。

  2026-09-10: expect の `tool_call_args_contains: {run_script: {skill_name: pdf-tools}}`
  を削除した。本ケースの設計上、PDF生成はmain agentが直接run_scriptを呼ぶのでは
  なく`dispatch_agent(agent_type="worker")`への委譲経由で行われる（judge指示7番も
  worker経由を許容している）。本評価基盤は007側のnotesに記載の通りdispatch_agent
  内部のツール呼び出しをtranscriptに記録しないため、このルールはworker委譲設計と
  併用すると常にFAILする構造的な欠陥だった（実機確認：workerが実際にcreate_pdf.py
  でPDFを生成しverifierも検証済みだったにもかかわらず、ルールベース判定は
  `expected {'skill_name': 'pdf-tools'} in one of []`でFAILしていた）。
