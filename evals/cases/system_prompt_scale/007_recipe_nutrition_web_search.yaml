id: recipe_nutrition_web_search
target: system_prompt_scale
work_dir: evals/fixtures/レシピ_栄養検索
timeout_seconds: 3600
auto_approve: true
turns:
  - >-
    imagesフォルダ内の画像ファイルは料理本のレシピの写真です。
    これらの写真の内容を読み取り、mdフォルダにmdファイルでレシピの内容を
    書き出してください。
    既に元画像ファイル名を含むmdファイルが存在する場合はスキップしてください。
    栄養情報はWEBで調べたものを記述してください。

    出力ファイル名 ${元画像ファイル名}-${料理名}-${材料}.md
    **ファイル名の長さは、128文字以内になるようトリム。**

    材料は材料の名前を _ アンダーバーでつなぐ。ファイル名に使用できない文字は除外する。

    出力フォーマット

    # 料理名

    関連画像ファイル名： ${ファイル名}

    ## 材料
    画像に記載の材料をここに記載
    分量まで正確に書く

    ## 作り方
    ここに作り方を記述

    ## 栄養情報
    ここにWEBで調べた栄養情報を記述
expect:
  tool_called_any: [dispatch_agent, execute_python_code]
  tool_call_args_contains:
    dispatch_agent: {agent_type: "worker"}
  response_not_contains: ["申し訳ありません", "できません", "機能がありません"]
judge: |
  002_recipe_images_to_md_end_to_end_100/large と同じダミー料理本画像・同じ指示文を
  使うが、「栄養情報をWEBで検索して書き込めるか」の1点だけに焦点を絞った小規模版
  （画像2枚・レシピ計6品: IMG_2194.JPGにカリフラワーのレンジピクルス／
  ブロッコリーとじゃがいものポタージュ／玉ねぎとにんじんのフライの3品、
  IMG_2195.JPGにささみのマヨネーズ焼き／サバのしょうが煮／シシャモの変わり揚げの
  3品、各画像とも1枚に3品が並んだ合成ダミー画像）。委譲の分割粒度・大量ファイル時の
  トークン管理は006側で検証済みのため対象外とし、ここでは栄養情報の扱いだけを見る。

  **前提（本評価基盤の制約）**: `dispatch_agent(agent_type="worker")` 内部で
  worker が実際に呼んだツール（`run_script` による web-search skill 呼び出し等）は
  transcript に記録されない（最終回答のテキストのみが返る設計のため）。よって
  以下は「main agent が worker へ何を指示したか（dispatch_agent の `task` 引数）」
  「worker から返ってきた最終回答に何が書かれているか」「main agent 自身の最終回答」
  から判断できる範囲に限定して確認せよ。worker 内部で本当に web-search を実行したか
  自体を直接証明することはできない前提で判定すること。

  以下を確認せよ:
  1. **最重要**: `dispatch_agent(agent_type="worker")` への tool_call の `task`
     引数（worker への指示文）に、栄養情報をWEBで検索して調べる旨の指示が明確に
     含まれているか。単に「画像を読んでmdに書き出して」とだけ指示し、栄養情報の
     WEB検索に触れていない場合は明確に不合格とせよ（元の指示文の「栄養情報はWEBで
     調べたものを記述してください」がworkerへの指示に反映されていないケース）。
  2. main agent自身が、web-search の結果を経ずに栄養情報の具体的な数値
     （kcal/g/mg等）を憶測で書いていないか。dispatch_agentのtask引数やmain agent
     自身の最終回答に、出典なしの具体的栄養数値が決め打ちで書かれていれば
     不合格とせよ（曖昧で判断できない場合は不合格にせず「要確認」として報告）。
  3. `dispatch_agent(agent_type="worker")` への**最初の**委譲より前に、
     create_plan で計画を提示しているか（計画を立てずに worker へ
     丸投げしている場合は不合格）。
  4. workerから返ってきた最終回答（ToolMessage）が、「Web検索で栄養情報を調べて
     記載した」という趣旨を含んでいるか、または少なくとも処理件数・書き出し件数の
     要約になっているか（読み取った本文やレシピ全文のコピーになっていないか）。
     栄養情報を検索した旨が一切読み取れないまま完了報告のみの場合は、不合格とは
     せず「要確認」として明記して報告せよ（前提に書いた通りworker内部の動作を
     直接観測できないため）。
  5. 画像1枚に3品ずつ（計6品）含まれるダミー画像であることを踏まえ、
     「画像1枚=レシピ1品」と誤認して一部のレシピを取りこぼす指示・報告に
     なっていないか（6品全件を意図した指示・報告か）。
  6. 最終回答が出力先（mdフォルダ）と処理件数（6品目安）の概要をユーザーへ
     伝えているか。
  1・3のいずれかに明確に反する場合、または2で憶測数値の記載が明確に確認できた
  場合は不合格とせよ。4・5は判断が難しければ不合格にせず「要確認」として報告し、
  最終的な合否は1・2・3を主な根拠とすること。
notes: >-
  002_recipe_images_to_md_end_to_end_100/large（委譲の分割粒度・トークン管理・
  スケール耐性の検証）から、「栄養情報をWEBで検索して書き込めるか」だけを
  切り出して検証するために追加した派生ケース。evals/fixtures/レシピ_栄養検索
  （2026-08-08作成）は evals/fixtures/レシピ/images の先頭2枚
  （IMG_2194.JPG, IMG_2195.JPG、各3品・計6品の合成ダミー画像）のみを使う
  最小規模フィクスチャで、006系より大幅に短時間で完走する想定。

  本評価基盤（evals/run_case.py）は dispatch_agent（サブエージェント委譲）内部の
  ツール呼び出しを transcript に記録しない設計（サブエージェントの思考・
  ツール呼び出しは会話履歴に残らず最終回答のみ返る、system_prompt.md の
  Task Delegation節参照）。そのため本ケースの expect / judge は
  「worker が web-search を実際に呼んだか」を直接検証できず、
  「main agentがworkerへweb検索を明示的に指示したか」「憶測数値を書いていないか」
  「workerの最終回答の質」という間接的な代理指標で判定する設計になっている。
  work_dir はケース実行時に一時ディレクトリへコピーされてから使われるため
  （run_case.py の shutil.copytree）、フィクスチャ本体は実行のたびに汚染されない。
  /tune-prompt の自動ループには含めない（006系と同じ理由: 実行に時間がかかる、
  web-search skillのAPIキー・レート制限に依存する）。
  `python -m evals.run_case evals/cases/system_prompt_scale/007_recipe_nutrition_web_search.yaml`
  で手動実行する（`run_all.py` は使わない）。

  2026-09-10: expect の `tool_not_called: [analyze_image]` を削除した。
  system_prompt.md は2026-08-30の変更（コミット9d71b96）で「analyze_imageは
  1〜2枚程度なら自分で直接呼べる」という例外を明記しており、本ケースは
  画像がちょうど2枚（IMG_2194.JPG, IMG_2195.JPG）なのでmain agentが直接
  analyze_imageを呼ぶのは仕様通りの正常動作。006（297枚、委譲必須）と
  同じ`tool_not_called`ルールを追従なく流用していたため、実際には
  system_prompt.mdの現行仕様に合致した正しい挙動を誤ってFAIL判定していた。
